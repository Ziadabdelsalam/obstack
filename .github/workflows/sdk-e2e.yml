# S2.4 D80 — `sdk-e2e`: the sprint's exit evidence, run as a check.
#
# One step, one command: `bash deploy/compose/sdk-evidence.sh`, verbatim, the
# same line the root README and the sprint's evidence bundle tell a human to run
# (S2.1 L3). Everything the exit clause claims is inside that script — every
# sample app landing a four-layer trace with the D8 GenAI attributes from
# nothing but an install and two lines, each rendering through the shipped query
# layer, standard OTLP proven against a stock upstream collector, fail-open
# proven live against a dead port. Nothing about the run is defined here, so
# there is no CI-only variant of the evidence to drift from the human one.
#
# S4.3/D307 added the third sample: `demo/sdk-sample-ts-ai7`, the TypeScript
# sample copied onto `ai` 7, whose `generateText` call passes no telemetry
# option at all — obstack-js's span is on by default there, and this job is
# where that default stops being a README sentence. It gets every leg its
# sibling gets, OTLP and fail-open included.
#
# The `stack` job is deliberately NOT extended with this (D80): it is the signed
# kind/Helm path and it runs on every PR, and folding a heavier compose run into
# it would put a required check's trigger policy at the mercy of this one.
#
# TRIGGER POLICY (K5/D41, settled by D93) — every PR, like `sdk-py` and
# `sdk-js`, and in the required set. Measured end to end on real runs of this
# job: **3m43s** (https://github.com/Ziadabdelsalam/obstack/actions/runs/32050575928)
# and **3m44s** (https://github.com/Ziadabdelsalam/obstack/actions/runs/32052107372)
# — two runs, consistent, comfortably under the ~6-minute line.
#
# BUDGET, re-based for the third sample (S4.3/D307). The base is the WORST
# measured point of the recent window, not its best: **4m04s** (run 32668332270;
# the last three were 3m46s / 3m59s / 4m04s, and a budget set from the 3m46s
# would be a budget that has already been exceeded). The twin adds, measured in
# CI9: ~45s for its image with the shared `obstack-js` pack stage already cached
# (`npm install` 28.4s + `npm run build` ~5s + layers), ~8s for its boot and
# trace selection, and ~24s for its OTLP and fail-open legs, which are IN by
# D307 — OTLP because it is the exit clause's literal wording on new emission
# code, fail-open because D26's promise is made per sample and an unmeasured
# sample has not made it. Projected worst point: **~4m59s–5m23s**, still under
# the ~6-minute line, and the 30-minute timeout below is unchanged.
#
# The `obstack-js` pack stage is byte-identical between the two TypeScript
# Dockerfiles on purpose — that is what keeps the twin at ~45s instead of paying
# the SDK build twice.
#
# This replaces a first policy set from a local number, and the reason it
# changed is worth keeping: the local measurement was 6m01s from destroyed
# volumes with an EMPTY docker builder cache on an Apple M4, with the sample
# images' `pip install` and `npm install` downloading over a domestic
# connection. Stating those conditions (S2.2 L2) is exactly what showed why the
# number did not transfer — a GitHub runner's network and image mirrors are the
# dominant term, and it pays them faster than this machine does. The deciding
# machine for a CI trigger policy is the runner, not the laptop.
#
# `sdk-e2e` is a K3-stable name from its first run; `web`, `go`, `kind` and
# `stack` are untouched.
name: sdk-e2e

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sdk-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-e2e:
    name: sdk-e2e
    runs-on: ubuntu-latest
    # Roughly 6x the ~5m projected worst point above (8x the original 3m44s),
    # and bounded for the reason every other job here is: the GitHub default is
    # 360 minutes, and a wedged compose `up` would hold the PR for all of it.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # The rendering proof runs the app's own server modules through tsx,
          # so this is the `web`/`stack` Node line, not the SDK's own floor.
          node-version: '24'
          cache: 'npm'

      # sdk-checks.ts imports `@/server/data` — the shipped facade — so the
      # root workspace install is a prerequisite of the evidence, not of CI.
      - run: npm ci

      - name: SDK exit evidence (deploy/compose/sdk-evidence.sh)
        # OUT_DIR is the script's own documented override: it changes where the
        # collector dumps and the sdk-checks log land, never what is asserted,
        # and it is what lets the step below read a red run afterwards. Set per
        # step because `runner` is not a context job-level `env` can see.
        env:
          OUT_DIR: ${{ runner.temp }}/sdk-evidence-out
        run: bash deploy/compose/sdk-evidence.sh

      - name: Diagnose on failure
        if: failure()
        env:
          OUT_DIR: ${{ runner.temp }}/sdk-evidence-out
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile '*' ps -a || true
          for svc in clickhouse ingest sdk-sample-py sdk-sample-ts sdk-sample-ts-ai7; do
            echo "::group::$svc"
            docker compose -f deploy/compose/docker-compose.yml --profile sdk logs --tail 60 "$svc" || true
            echo "::endgroup::"
          done
          echo "::group::artifacts"
          ls -la "$OUT_DIR" || true
          cat "$OUT_DIR"/sdk-checks.log || true
          echo "::endgroup::"
