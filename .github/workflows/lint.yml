# `lint` — the eslint gate over the web app (D261). K3: this job name is a
# stable identifier, chosen once and never renamed — a rename silently voids
# any required-checks reference to it.
#
# Born clean, by ruling: D261 refused a lint job with carve-outs, so the six
# recorded pre-existing errors (and the one warning) were fixed in the same
# change that added this file, and the gate runs at --max-warnings 0. A
# finding here is a defect to fix, never a baseline to ignore.
#
# Every-PR from birth, provisionally: `npm ci` plus one eslint pass is the
# whole job, so it is projected well inside the K5 line — but the deciding
# machine is the GitHub runner, never a laptop, so the first real-runner
# number returns to the advisor and confirms or demotes that (K5/D93/D137).
name: lint

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: eslint (zero errors, zero warnings)
        # From apps/web, where eslint.config lives — a repo-root invocation
        # finds no flat config and dies before linting anything.
        working-directory: apps/web
        run: npx eslint src --max-warnings 0
