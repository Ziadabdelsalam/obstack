name: web

on:
  pull_request:
    branches:
      - master

concurrency:
  group: web-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Single path anchor for this job (K3-ii): the workspace root. CI runs the
    # exact same root-delegated commands the runbooks tell humans to run (`npm
    # ci`/`npm test`/`npm run build`) — one definition of the suite for both —
    # and those root scripts cover `apps/web` transitively via the npm
    # workspace wiring, so this anchor does not need to chase the app's path.
    working-directory: .

jobs:
  web:
    runs-on: ubuntu-latest
    # Bounds a required check: without it a wedged build would hold the PR
    # for the 360-minute GitHub default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # K1, same mechanism as go.yml: ClickHouse comes up via the same compose
      # service local dev uses — one definition of the D11 users
      # (deploy/compose/clickhouse/users.d), never a second copy. This is what
      # makes the ClickHouse-backed integration tests
      # (apps/web/src/server/queries/traces.integration.test.ts) actually run
      # here instead of skipping (T3's E1 escalation, ruled onto this job).
      #
      # `ingest` rides along for the same K1 reason: it owns the obstack
      # database and its DDL, applied at boot from the migrations embedded in
      # the binary (docker-compose.yml's own words). A bare `up clickhouse` on
      # CI's fresh volume has no schema at all, so the tests fail with
      # UNKNOWN_DATABASE — measured on this job's first enforced run, not
      # assumed — and the alternative (this job hand-applying DDL) would be a
      # second definition of the migration path, which K1 refuses.
      #
      # Postgres is not named here because it does not need to be: `ingest`
      # depends on it with `condition: service_healthy`, so compose starts it
      # first and holds ingest back until it answers, and the same boot applies
      # the second embedded set (services/ingest/pgmigrations/*.sql, in filename
      # order) to it. A returning `--wait` therefore means a healthy, migrated
      # Postgres — which is what the test step below dials.
      - name: Start ClickHouse + ingest (deploy/compose; Postgres rides ingest's depends_on)
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait --wait-timeout 120 clickhouse ingest

      - uses: actions/setup-node@v7.0.0
        with:
          # Active-LTS major meeting Next 16.3's documented floor (Node.js
          # 20.9.0+, node_modules/next/dist/docs/01-app/02-guides/upgrading/version-16.md).
          node-version: '24'
          # Caches npm's package-download cache only, keyed on package-lock.json.
          # Does not cache `.next` build output, so it carries no risk of the M1
          # F6 finding (build reuses cached prerenders across OBSTACK_DATA_MODE
          # changes) — nothing OBSTACK_DATA_MODE-shaped is persisted here.
          cache: 'npm'

      - run: npm ci

      # D36 skip trap, mirroring go.yml's: the ClickHouse integration tests
      # skip themselves when no ClickHouse answers, and the Postgres ones when
      # the DSN below is unset (a Postgres that does not answer FAILS them, it
      # never skips them), so a green run proves nothing unless an unexpected
      # skip fails the job. The env is the readonly web user against the
      # compose ClickHouse above — deploy/compose/README.md's
      # live-mode block, reused rather than copied into a second config
      # artifact — plus the Postgres DSN the *.integration.test.ts files dial.
      #
      # node:test's reporter differs by version/TTY (tap piped on some
      # versions, spec on others), so the trap fails CLOSED: the runner's own
      # "skipped N" summary must be present and must agree with the skip lines
      # this grep can see — a reporter change that hid skips goes red instead
      # of hollow (S2.0 L1).
      - env:
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_USER: obstack_web
          CLICKHOUSE_PASSWORD: obstack_web_dev
          # apps/web/src/server/*.integration.test.ts skip themselves on exactly
          # one condition — this variable being unset — so setting it here is
          # what makes them run, and the trap below is what keeps them running.
          # A dead address does NOT get them a skip: they fail loudly naming
          # what they dialled.
          #
          # No Postgres service container, deliberately (D130): the compose
          # Postgres started above is already here, already migrated by ingest's
          # boot migrator from the checked-in services/ingest/pgmigrations —
          # the same K1 argument the ClickHouse comment above makes, and the
          # only way this job avoids owning a second definition of that schema.
          # A service container would also publish 5432 against compose's own
          # publish of it (measured: `Bind for 127.0.0.1:5432 failed: port is
          # already allocated`), and service containers start before step 1, so
          # the collision would kill the compose step rather than any test.
          # Dev credentials, one definition, the same DSN string go.yml uses.
          OBSTACK_TEST_POSTGRES_DSN: postgres://obstack:obstack_postgres_dev@127.0.0.1:5432/obstack
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e

          # Skip allowlist (K4): empty today. Add test names here, with a
          # comment naming the reviewed reason, before adding a skip to any
          # *.test.ts or *.test.tsx file (the runner's glob covers both since
          # D54(i)) — an unlisted skip must fail this job.
          allowed_skips=()

          # The runner's own summary count ("# skipped N" under tap,
          # "ℹ skipped N" under spec). Missing summary = fail closed.
          skip_count=$(grep -E ' skipped [0-9]+$' test-output.log | awk '{print $NF}' | tail -1)
          if [ -z "$skip_count" ]; then
            echo "::error::no node:test skipped-count summary in the output — the skip trap cannot verify, failing closed"
            exit 1
          fi

          # Per-skip lines: "ok N - name # SKIP reason" (tap) or
          # "﹣ name (skipped: reason)" (spec).
          skip_lines=$(grep -E -- '# SKIP|\(skipped' test-output.log || true)
          seen=0
          fail=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            seen=$((seen + 1))
            listed=0
            for a in "${allowed_skips[@]:-}"; do
              # the :- fallback expands an empty allowlist to one empty
              # entry, and *""* would match every line — never allowlist it
              [ -z "$a" ] && continue
              case "$line" in *"$a"*) listed=1 ;; esac
            done
            if [ "$listed" -eq 0 ]; then
              echo "::error::unexpected test skip, not on the allowlist: $line"
              fail=1
            fi
          done <<< "$skip_lines"

          if [ "$seen" -ne "$skip_count" ]; then
            echo "::error::the runner counted $skip_count skip(s) but the trap saw $seen skip line(s) — reporter format drift, failing closed"
            fail=1
          fi

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

          exit "$status"

      - run: npm run build

      # `down -v` takes the whole project, Postgres and its named volume
      # included — nothing this job wrote survives into another run.
      - name: Stop the compose stack (deploy/compose)
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
