# S2.2 T5 — stack-on-kind: the sprint's exit assertion (D35: Helm is the ONLY
# kind path; D37: the three-part correlation evidence). The job runs
# deploy/helm/obstack/acceptance.sh — the exact script the chart README tells
# a human to run (S2.1 L3), no bespoke CI sequence and no CI-only timeout
# arithmetic: the Helm budget lives in that script, sourced from the chart
# README. The script builds + side-loads the images, installs the real chart,
# drives POST /chat, asserts the D37 bundle through the D17 tsx facade harness
# against the cluster's ClickHouse, restarts the collector (the T1
# file_storage rider), and lands the D38(e) event-form GenAI fixture through
# the collector.
#
# S3.1 adds steps after it, not jobs: Postgres arrived in this chart
# (D95/D112), so the same release is asked whether the pg-migrate Job's DDL
# is actually in its database. Same L3 rule — the step is the chart README's
# own line, byte for byte. `stack` keeps its name (K3); the signup path
# arrives in the separate `e2e` job, not here.
#
# S3.1's OTHER Postgres step — the D122 captured-DDL drift guard — LEFT this
# job in S4.3, with its compose start/stop riders and its diagnose line. That
# is D298's one carve-out, restated by D306(d), and it is load-bearing: the
# guard's failure source is app code ordinary web PRs touch (`authConfig()`,
# apps/web/src/server/auth.ts), so on a job that no longer gates a merge it
# would first go red AFTER the merge — its exact designed catch, converted
# into a post-merge stop-the-line. It runs in `e2e` now, which already has
# the compose Postgres it makes its scratch database on and already runs the
# root `npm ci` it needs. The chart-Postgres schema step below STAYS: that
# one is a chart assertion and needs the cluster.
#
# Trigger policy (K5/D41 decision RULE) — THE OVER-BRANCH HAS FIRED (D298,
# implemented here in S4.3 as restated by D306). The rule was: measure the
# full job's wall-clock, then pick a branch. Measured end to end on real PR
# runs since S4.1 — checkout, npm ci, image builds, kind cluster, pulls +
# side-load, helm install, all assertions and riders: 7m17 · 5m58 · 6m45 ·
# 7m06 · 7m02, a band of 5m58–7m17 whose FLOOR sits at the ~6-minute line.
# D298 declined to re-base the watch to that band — S4.1's premise that the
# cached steady state collapses to seconds is falsified, the cache restore
# plus miss variance IS the structural cost, and watches absorb variance,
# never structural breaches. So:
#
#   `stack` is NOT in the PR required set. On `pull_request` it is
#   path-filtered, on `push` to master it ALWAYS runs, and
#   `workflow_dispatch` is there for the rare force. Never
#   required-but-conditional.
#
# (Branch protection itself is deliberately skipped by user decision — the
# API returns 403 on a private repo on this plan — so "required" is the
# advisory set the merge process gates on, and dropping `stack` from it is a
# prose + process change, recorded at root README.md's CI section.)
#
# WHERE THE RECLAIM COMES FROM, stated honestly (D306(a)): from the
# required-set drop, not from the filter. The filter below is what
# `acceptance.sh` actually builds, read off the script and the Dockerfile
# rather than guessed — the ingest image (`services/ingest/**`), the
# demo-agent image (`demo/agent-app/**`), the web image built from
# `apps/web/Dockerfile` with the REPO ROOT as its context (`apps/web/**`
# whole, plus the three manifests that Dockerfile copies: `package.json`,
# `package-lock.json`, `packages/obstack-js/package.json`), the chart and the
# compose definitions (`deploy/**`), and this file. `apps/web/**` in that
# list means the filter fires on most PRs, and a narrower list would be a lie
# about what this job's evidence depends on. `deploy/**` is wider than what
# this job now reads — `deploy/compose/**` sits inside it and `stack` stopped
# reading compose when the D122 guard left — so those paths over-fire; for a
# filter whose failure mode is a build that never ran, over-firing is the
# safe direction. The PR critical path drops to `e2e`'s band because `stack`
# stopped gating a merge, not because it stopped running.
#
# THE BACKSTOP is D41's rider, promoted to primary: a red `stack` on master
# is stop-the-line for the next PR. That is what makes the drop safe, which
# makes `push: branches: [master]` load-bearing rather than decoration — and
# is why the concurrency block below must not cancel those runs.
#
# THE WATCH is re-based to master pushes (D298): `stack` is measured there
# henceforth. No master-push run has ever existed in this repo, so the watch
# opens on the FIRST master-push number; the 5m58–7m17 band above is the
# PR-run prior, not the new baseline. Moving the D122 guard out removes a
# measured ~10s (guard 4s + its compose start 6s). Subtract that from the
# **S4.2 PR run's 7m06** — the run those 4s were measured on, not the list's
# last entry (7m02) — and ≈6m56 is what is left: still over the K5 line,
# exactly as D298 accepted when it chose the branch instead of a re-base
# (D306(e)). That number is not a regression and re-fires nothing. `stack`
# is a K3-stable name from its first run; `web`/`go`/`kind` are untouched.
name: stack

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/stack.yml
      - deploy/**
      - services/ingest/**
      - demo/agent-app/**
      - apps/web/**
      - packages/obstack-js/package.json
      - package.json
      - package-lock.json
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: stack-${{ github.head_ref || github.ref }}
  # D306(b), binding: on a push the group collapses to
  # `stack-refs/heads/master`, so `cancel-in-progress: true` would let a
  # second merge CANCEL the first merge's run — a hole in the D41 backstop
  # that is now this job's whole reason to run on master. PR runs are still
  # superseded by the next push to their branch. An IN-PROGRESS master run is
  # never cancelled — `cancel-in-progress` is PR-only. GitHub does still cancel
  # a PENDING run when a newer one queues into the same group, so on a rapid
  # double-merge the middle commit's `stack` run can be superseded while it is
  # still queued: the backstop D41 buys is therefore "every merge that reaches
  # the head of the queue", not literally every merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stack:
    name: stack
    runs-on: ubuntu-latest
    # Bounds the job the same way web/go/kind bound theirs: a wedged install
    # would otherwise hold the runner for the 360-minute default. The
    # acceptance script's own Helm budget (900s cold install) plus builds,
    # pulls and assertions fits well inside this.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # Same floor as web.yml: the acceptance harness is the D17 tsx
          # facade path, running the app's own server modules.
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: obstack-stack

      # The web image, pre-built with a layer cache so acceptance.sh reuses it
      # (its own skip-and-state logic — advisor ruling on the first-runner
      # numbers: building it cold inside this job pushed stack from its
      # 5m04–12s range to 7m13s, a structural cost, not variance; the cached
      # steady state collapses to seconds). `load: true` lands it in the local
      # daemon under the exact :kind tag the script and values.yaml pin.
      # The first cached run died at the kind image-import with "no space left
      # on device": the buildx builder holds its own copy of the web image's
      # build-stage layers beside the daemon image and the gha-cache export,
      # and this job also carries every chart image twice (daemon + kind
      # node). Two frees, both mechanical: the runner's preinstalled Android
      # SDK/CodeQL (~15GB this job never touches), and — after the load — the
      # builder's local snapshots (the gha export has already happened; the
      # daemon keeps the loaded :kind image).
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Set up buildx (layer cache backend)
        uses: docker/setup-buildx-action@v4.3.0

      - name: Pre-build obstack-web:kind (gha layer cache)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: OBSTACK_DATA_MODE=live
          tags: obstack-web:kind
          load: true
          cache-from: type=gha,scope=web-kind
          cache-to: type=gha,mode=max,scope=web-kind

      - name: Drop the builder's local snapshots (image is loaded, cache is exported)
        run: |
          docker buildx prune -af >/dev/null
          df -h / | tail -1

      # The whole exit assertion — identical to a human's local run
      # (README.md, "Running the acceptance"): the script reads the cluster
      # from the current kubectl context, which kind-action just set.
      - name: Stack acceptance (deploy/helm/obstack/acceptance.sh)
        run: bash deploy/helm/obstack/acceptance.sh

      # S3.1: the Postgres boot path, in this job rather than a new one (K3 —
      # `stack` is the stack's assertion and keeps its name). One line, and
      # it is the same line the chart README tells a human to run after an
      # install (README.md, "Postgres in this chart" — S2.1 L3, no CI-only
      # sequence): the pg-migrate Job's own store, asked directly whether the
      # DDL is there. ON_ERROR_STOP turns a missing relation into a non-zero
      # exit; zero rows is a pass, since a fresh install has no workspaces
      # until somebody signs up.
      #
      # It asserts the RESULT, not the Job object, on purpose: the
      # install-rendered Job carries ttlSecondsAfterFinished and may be
      # collected before this step runs, while the upgrade-rendered one is a
      # hook that deletes itself on success — the database is the only thing
      # both paths leave behind. Nor does it race that Job: the release
      # acceptance.sh installed cannot go green until the ingest pods verify
      # the Postgres set (OBSTACK_PG_MIGRATE_ON_BOOT=false), which cannot
      # happen before pg-migrate applied it. This step is what names the
      # tables the product actually needs.
      - name: Postgres schema (deploy/helm/obstack/README.md, "Postgres in this chart")
        run: |
          kubectl exec statefulset/obstack-postgres -- psql -U obstack -d obstack -v ON_ERROR_STOP=1 \
            -c 'SELECT 1 FROM workspaces LIMIT 1' -c 'SELECT 1 FROM saved_views LIMIT 1'

      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl get events --sort-by=.metadata.creationTimestamp | tail -40 || true
          helm status obstack || true
          kubectl logs ds/obstack-collector --tail=80 || true
          kubectl logs deploy/obstack-collector-cluster --tail=80 || true
          kubectl logs deploy/obstack-ingest --tail=40 || true
          kubectl logs deploy/obstack-demo -c demo-agent --tail=40 || true
          kubectl logs statefulset/obstack-postgres --tail=40 || true
          kubectl logs -l app.kubernetes.io/component=pg-migrate --tail=40 --all-containers || true
