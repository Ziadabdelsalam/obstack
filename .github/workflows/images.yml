# `images` — the S4.1 exit clause as a job: a clean checkout produces the web
# and ingest images, and the compose bundle boots the full stack FROM those
# images (D261). K3: stable identifier, named once, never renamed.
#
# Kept separate from `stack` (5m04–12s) and `e2e` (5m47–50s) so their
# recorded ranges and pre-registered watches stay unpolluted — the D107
# "stay separate" ground. Trigger policy: provisionally every-PR; the first
# real-runner number returns to the advisor and confirms or demotes it
# (K5/D93/D137 — the deciding machine is the GitHub runner, never a laptop).
#
# What it proves, in order:
#   1. Both D262 variants of the ONE web Dockerfile build at this commit —
#      live-stamped and mock-stamped (D251(a)/D267).
#   2. The mode stamp is load-bearing: a mock artifact served as live REFUSES
#      (exit 1, naming both values), a mock artifact pointed at a real billing
#      rail refuses the same way (D353), and a live artifact without its
#      BETTER_AUTH_SECRET refuses with the generate instruction (D251(b),
#      D265(a2)/D272 — the "costs signup entirely" stakes, proven red here on
#      every PR).
#   3. The ClickHouse image's users.d file grants what it claims and no more:
#      `obstack_ingest` owns `obstack` and nothing outside it, `obstack_web`
#      cannot write in it, and `default` is unreachable over the container
#      network even when CLICKHOUSE_PASSWORD is set (D350).
#   4. The mock variant serves standalone with no stores at all — the D262
#      public-demo artifact is a real, bootable thing, not a claim.
#   5. `docker compose up` boots clickhouse + postgres + ingest + web from
#      images built at this same commit (compose's own `build:` directives —
#      D267), converges healthy, and answers a real request.
name: images

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: images-${{ github.head_ref || github.ref }}
  # D306(b) / D333: on a push the group collapses to `images-refs/heads/master`,
  # so `cancel-in-progress: true` would let a second merge cancel the first
  # merge's publish run mid-push — a hole in the D41 backstop. An IN-PROGRESS
  # master run is never cancelled; `cancel-in-progress` is PR-only (copied
  # verbatim from stack.yml:96-112).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    # Bounded like every job here: a wedged `docker build` or compose `up`
    # must fail the PR in minutes, not hold it for the 360-minute default.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build the web image, both D262 variants
        run: |
          docker build -t obstack-web:live -f apps/web/Dockerfile --build-arg OBSTACK_DATA_MODE=live .
          docker build -t obstack-web:mock -f apps/web/Dockerfile --build-arg OBSTACK_DATA_MODE=mock .

      - name: Build the ingest image
        run: docker build -t obstack-ingest:ci services/ingest

      - name: Build the Railway ClickHouse image
        run: docker build -t obstack-clickhouse:ci -f deploy/railway/clickhouse/Dockerfile .

      # D350: the two application grants and the loopback-only `default` user,
      # proven on the runner in the same shape as the refusal matrix below — a
      # broken XML is a database anyone can create in, which without this arm
      # would only surface once Railway starts serving partner data.
      #
      # The client runs from the image under test itself, so client and server
      # are the same build by construction and the ClickHouse version stays
      # pinned in exactly one place (this Dockerfile's `FROM`).
      - name: ClickHouse grants probe (D350)
        run: |
          trap 'docker rm -f ci-ch >/dev/null 2>&1 || true; docker network rm ci-ch-net >/dev/null 2>&1 || true' EXIT
          docker network create ci-ch-net
          # CLICKHOUSE_PASSWORD is set ON PURPOSE, and it is the whole point of
          # the `default` arm below. The base image's entrypoint restricts
          # `default` to loopback ONLY while neither CLICKHOUSE_USER nor
          # CLICKHOUSE_PASSWORD is set ("disabling network access for user
          # 'default'", its own log line); setting either makes it stop, and
          # `default` becomes a network-reachable superuser. So a probe run
          # WITHOUT this variable would pass on the base image alone and prove
          # nothing about D350. With it set, the users.d `<default><networks
          # replace="replace">` block is the only thing left that can refuse.
          docker run -d --name ci-ch --network ci-ch-net \
            -e CLICKHOUSE_PASSWORD=ci-default \
            -e OBSTACK_CLICKHOUSE_INGEST_PASSWORD=ci-ingest \
            -e OBSTACK_CLICKHOUSE_WEB_PASSWORD=ci-web \
            obstack-clickhouse:ci

          # `docker exec` reaches the server over the container's own loopback,
          # so this readiness loop is also the POSITIVE half of D350: `default`
          # still works there, which is what the compose healthcheck and
          # `kubectl exec` both rely on.
          for _ in $(seq 1 30); do
            if docker exec ci-ch clickhouse-client --query 'SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          docker logs ci-ch --tail 40
          test "${ready:-0}" = 1 || { echo "clickhouse never answered SELECT 1 on loopback default"; exit 1; }

          probe() {
            docker run --rm --network ci-ch-net obstack-clickhouse:ci clickhouse-client --host ci-ch "$@"
          }

          set +e
          # The password below is the CORRECT one, so credentials cannot be what
          # refuses this connection — only the network restriction can, and it
          # refuses at connect time (code 516) before any query runs. That is
          # why the arm is a bare SELECT and not a DDL statement: nothing gets
          # as far as the grant layer.
          default_out="$(probe --user default --password ci-default --query 'SELECT 1' 2>&1)"; default_rc=$?
          # `GRANT ALL ON obstack.*` is scoped to that one database: it covers
          # `CREATE DATABASE obstack` and the DDL ingest applies inside it, and
          # nothing outside it. These are the statements ingest actually runs.
          ingest_db_out="$(probe --user obstack_ingest --password ci-ingest --query 'CREATE DATABASE IF NOT EXISTS obstack' 2>&1)"; ingest_db_rc=$?
          ingest_tbl_out="$(probe --user obstack_ingest --password ci-ingest --query 'CREATE TABLE obstack.ci_ok (x UInt8) ENGINE=Memory' 2>&1)"; ingest_tbl_rc=$?
          ingest_drop_out="$(probe --user obstack_ingest --password ci-ingest --query 'DROP TABLE obstack.ci_ok' 2>&1)"; ingest_drop_rc=$?
          # The read/write split, stated where it bites: `obstack_web` reads
          # `obstack` and cannot write in it. A CREATE DATABASE arm would not
          # say this — `obstack_ingest` cannot do that either.
          web_out="$(probe --user obstack_web --password ci-web --query 'CREATE TABLE obstack.ci_x (x UInt8) ENGINE=Memory' 2>&1)"; web_rc=$?
          ping_out="$(docker run --rm --network ci-ch-net obstack-clickhouse:ci sh -c 'wget -qO- http://ci-ch:8123/ping' 2>&1)"
          set -e

          test "$default_rc" -ne 0 || { echo "the default user answered over the container network — the D350 loopback restriction is gone"; echo "$default_out"; exit 1; }
          echo "$default_out" | grep -q "Code: 516" || { echo "default was refused, but not by the network restriction (expected code 516)"; echo "$default_out"; exit 1; }
          test "$ingest_db_rc" -eq 0 || { echo "obstack_ingest could not create its own database — the ingest grant is broken"; echo "$ingest_db_out"; exit 1; }
          test "$ingest_tbl_rc" -eq 0 || { echo "obstack_ingest could not create a table in obstack — the ingest grant is broken"; echo "$ingest_tbl_out"; exit 1; }
          test "$ingest_drop_rc" -eq 0 || { echo "obstack_ingest could not drop the table it just created — the ingest grant is broken"; echo "$ingest_drop_out"; exit 1; }
          test "$web_rc" -ne 0 || { echo "obstack_web was able to CREATE TABLE in obstack — the read-only grant is broken"; echo "$web_out"; exit 1; }
          echo "$web_out" | grep -q "ACCESS_DENIED" || { echo "obstack_web's CREATE failed but not with ACCESS_DENIED"; echo "$web_out"; exit 1; }
          echo "$ping_out" | grep -q "^Ok\.$" || { echo "/ping never answered Ok."; echo "$ping_out"; exit 1; }

      # The refusal matrix — the boot check proven RED on the runner, not
      # believed from a unit test (process.exit(1) is only observable against
      # a real container; T1's own report records why).
      # `timeout 60` on both, and exit code 1 EXACTLY: a broken refusal is a
      # container that boots and serves forever, which without the bound would
      # hold this job to its 25-minute timeout, and `timeout`'s own 124 would
      # otherwise read as "non-zero, therefore refused". The message is grepped
      # too — any other crash also exits non-zero, and "it died" is not the
      # claim this job makes.
      - name: Mode-mismatch refusal (mock artifact served as live)
        run: |
          set +e
          out="$(timeout 60 docker run --rm -e OBSTACK_DATA_MODE=live -e BETTER_AUTH_SECRET=ci-refusal-probe obstack-web:mock 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "mock-stamped artifact did not refuse a live serve with exit 1 (rc=$rc) — the D251(b) refusal is broken"; echo "$out"; exit 1; }
          echo "$out" | grep -q "OBSTACK_DATA_MODE=mock baked in" || { echo "the refusal never named the STAMPED value"; echo "$out"; exit 1; }
          echo "$out" | grep -q "running with OBSTACK_DATA_MODE=live" || { echo "the refusal never named the RUNTIME value"; echo "$out"; exit 1; }

      # D353: the billing-mode stamp is load-bearing the same way the data
      # mode is — a mock artifact must refuse to serve with a real billing
      # mode set at runtime, naming both values, rather than boot and
      # advertise a rail no request in that artifact can reach
      # (apps/web/src/server/mode-stamp.ts).
      - name: Billing-mode mismatch refusal (mock image, OBSTACK_BILLING_MODE=polar)
        run: |
          set +e
          out="$(timeout 60 docker run --rm -e OBSTACK_DATA_MODE=mock -e OBSTACK_BILLING_MODE=polar obstack-web:mock 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "mock-stamped artifact did not refuse OBSTACK_BILLING_MODE=polar with exit 1 (rc=$rc) — the D353 refusal is broken"; echo "$out"; exit 1; }
          echo "$out" | grep -q "OBSTACK_BILLING_MODE=polar" || { echo "the refusal never named the runtime billing mode"; echo "$out"; exit 1; }
          echo "$out" | grep -q "OBSTACK_DATA_MODE=mock" || { echo "the refusal never named the stamped data mode"; echo "$out"; exit 1; }

      - name: Live-without-secret refusal
        run: |
          set +e
          out="$(timeout 60 docker run --rm -e OBSTACK_DATA_MODE=live obstack-web:live 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "live artifact did not refuse without its auth secret with exit 1 (rc=$rc) — the D272 refusal is broken"; echo "$out"; exit 1; }
          echo "$out" | grep -q "BETTER_AUTH_SECRET" || { echo "refusal happened but never named the missing variable"; echo "$out"; exit 1; }
          echo "$out" | grep -q "openssl rand -base64 32" || { echo "refusal named the variable but not how to generate one"; echo "$out"; exit 1; }

      - name: Mock variant serves standalone (the D262 demo artifact)
        run: |
          docker run -d --name demo-probe -p 127.0.0.1:3100:3000 -e OBSTACK_DATA_MODE=mock obstack-web:mock
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/app; then ok=1; break; fi
            sleep 2
          done
          docker logs demo-probe --tail 20
          docker rm -f demo-probe
          test "${ok:-0}" = 1 || { echo "mock artifact never answered /app"; exit 1; }

      # The bundle boot: compose's `build:` directives rebuild web (live) and
      # ingest from this same commit — layer cache makes this cheap after the
      # builds above — and `--wait` holds until every healthcheck passes,
      # including web's own /login probe.
      - name: Compose bundle boots from these images
        env:
          OBSTACK_BETTER_AUTH_SECRET: images-ci-run-secret
        run: |
          docker compose -f deploy/compose/docker-compose.yml up -d --build --wait --wait-timeout 300
          curl -fsS -o /dev/null http://127.0.0.1:3000/login
          docker compose -f deploy/compose/docker-compose.yml down -v

  # Runs only on a master push, once `images` has proven the same Dockerfiles
  # build clean and refuse correctly at this commit. This is the only job
  # granted registry write scope — PR runs never carry a token that can push
  # (D332/D333).
  # Tags are `sha-<github.sha>` ONLY: no `latest`, no `master`, so Railway's
  # image ref always names the exact digest CI built and refusal-tested.
  publish:
    name: publish
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/ziadabdelsalam
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Token and actor arrive as ENV, never as `${{ }}` spliced into the shell
      # script: an expression is substituted before bash parses the line, so a
      # value carrying a quote or a `$` would be parsed as script rather than as
      # data. GitHub's masking hides the token in the log either way; this is
      # about what the shell executes.
      - name: Log in to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      # `vars.OBSTACK_STATUS_MONITOR_URL` is unset until T0 names the Better
      # Stack page (D342), and unset is a fine value: the build arg is then
      # empty and `/status` renders the no-monitor sentence. It arrives as ENV
      # and is quoted so a value with a space cannot split into a second
      # argument or be parsed as script.
      - name: Build and push obstack-web:live-sha-${{ github.sha }}
        env:
          STATUS_MONITOR_URL: ${{ vars.OBSTACK_STATUS_MONITOR_URL }}
        run: |
          docker build -t "$REGISTRY/obstack-web:live-sha-${{ github.sha }}" -f apps/web/Dockerfile \
            --build-arg OBSTACK_DATA_MODE=live \
            --build-arg "OBSTACK_STATUS_MONITOR_URL=$STATUS_MONITOR_URL" \
            .
          docker push "$REGISTRY/obstack-web:live-sha-${{ github.sha }}"

      - name: Build and push obstack-web:mock-sha-${{ github.sha }}
        env:
          STATUS_MONITOR_URL: ${{ vars.OBSTACK_STATUS_MONITOR_URL }}
        run: |
          docker build -t "$REGISTRY/obstack-web:mock-sha-${{ github.sha }}" -f apps/web/Dockerfile \
            --build-arg OBSTACK_DATA_MODE=mock \
            --build-arg OBSTACK_APP_ORIGIN=https://app.obstack.dev \
            --build-arg "OBSTACK_STATUS_MONITOR_URL=$STATUS_MONITOR_URL" \
            .
          docker push "$REGISTRY/obstack-web:mock-sha-${{ github.sha }}"

      - name: Build and push obstack-ingest:sha-${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/obstack-ingest:sha-${{ github.sha }}" services/ingest
          docker push "$REGISTRY/obstack-ingest:sha-${{ github.sha }}"

      - name: Build and push obstack-clickhouse:sha-${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/obstack-clickhouse:sha-${{ github.sha }}" -f deploy/railway/clickhouse/Dockerfile .
          docker push "$REGISTRY/obstack-clickhouse:sha-${{ github.sha }}"

      # Same refusal proven in `images`, re-run against the artifact actually
      # pulled back from GHCR — proves the pushed bytes refuse, not just the
      # local build cache.
      - name: Mode-mismatch refusal on the published mock image
        run: |
          docker pull "$REGISTRY/obstack-web:mock-sha-${{ github.sha }}"
          set +e
          out="$(timeout 60 docker run --rm -e OBSTACK_DATA_MODE=live -e BETTER_AUTH_SECRET=ci-refusal-probe "$REGISTRY/obstack-web:mock-sha-${{ github.sha }}" 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "published mock-stamped image did not refuse a live serve with exit 1 (rc=$rc) — the D251(b) refusal is broken"; echo "$out"; exit 1; }
          echo "$out" | grep -q "OBSTACK_DATA_MODE=mock baked in" || { echo "the refusal never named the STAMPED value"; echo "$out"; exit 1; }
          echo "$out" | grep -q "running with OBSTACK_DATA_MODE=live" || { echo "the refusal never named the RUNTIME value"; echo "$out"; exit 1; }

      - name: Billing-mode mismatch refusal on the published mock image (D353)
        run: |
          set +e
          out="$(timeout 60 docker run --rm -e OBSTACK_DATA_MODE=mock -e OBSTACK_BILLING_MODE=polar "$REGISTRY/obstack-web:mock-sha-${{ github.sha }}" 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "published mock-stamped image did not refuse OBSTACK_BILLING_MODE=polar with exit 1 (rc=$rc)"; echo "$out"; exit 1; }
          echo "$out" | grep -q "OBSTACK_BILLING_MODE=polar" || { echo "the refusal never named the runtime billing mode"; echo "$out"; exit 1; }
          echo "$out" | grep -q "OBSTACK_DATA_MODE=mock" || { echo "the refusal never named the stamped data mode"; echo "$out"; exit 1; }

      # D352: the published live tag must actually serve /login — proves the
      # pushed bytes boot the real login page, not just that they refuse
      # correctly. CLICKHOUSE_URL points at an unreachable loopback port so
      # this never touches a real store; measured locally against this same
      # Dockerfile (T1's own build) that /login answers 200 immediately with
      # no reachable ClickHouse or Postgres, so the probe is not weakened.
      - name: Boot the published live image and probe /login (D352)
        run: |
          docker pull "$REGISTRY/obstack-web:live-sha-${{ github.sha }}"
          docker run -d --name publish-live-probe -p 127.0.0.1:3200:3000 \
            -e OBSTACK_DATA_MODE=live \
            -e BETTER_AUTH_SECRET=ci-publish-probe \
            -e CLICKHOUSE_URL=http://127.0.0.1:1 \
            "$REGISTRY/obstack-web:live-sha-${{ github.sha }}"
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/login || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          docker logs publish-live-probe --tail 20
          docker rm -f publish-live-probe
          test "${ok:-0}" = 1 || { echo "published live image never answered /login with 200 (last code: ${code:-none})"; exit 1; }

      - name: Live-without-secret refusal on the published live image
        run: |
          docker pull "$REGISTRY/obstack-web:live-sha-${{ github.sha }}"
          set +e
          out="$(timeout 60 docker run --rm -e OBSTACK_DATA_MODE=live "$REGISTRY/obstack-web:live-sha-${{ github.sha }}" 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "published live image did not refuse without its auth secret with exit 1 (rc=$rc) — the D272 refusal is broken"; echo "$out"; exit 1; }
          echo "$out" | grep -q "BETTER_AUTH_SECRET" || { echo "refusal happened but never named the missing variable"; echo "$out"; exit 1; }
          echo "$out" | grep -q "openssl rand -base64 32" || { echo "refusal named the variable but not how to generate one"; echo "$out"; exit 1; }

      - name: Record published digests
        run: |
          {
            echo "### Published images (sha \`${{ github.sha }}\`)"
            echo
            for ref in \
              "$REGISTRY/obstack-web:live-sha-${{ github.sha }}" \
              "$REGISTRY/obstack-web:mock-sha-${{ github.sha }}" \
              "$REGISTRY/obstack-ingest:sha-${{ github.sha }}" \
              "$REGISTRY/obstack-clickhouse:sha-${{ github.sha }}"; do
              digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
              echo "- \`$ref\` -> \`$digest\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
