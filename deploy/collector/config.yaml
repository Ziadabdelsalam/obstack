# obstack-collector — the Kubernetes / DaemonSet form.
#
# A CONFIGURATION over an unmodified upstream image (D14, PRD §5
# "distribution, not fork"): the binary is upstream's, only the pipeline
# below is obstack's. Image pin and the verification that it actually
# contains `file_log` and `k8s_attributes` — the core `otelcol-contrib`
# distro does not — are in README.md.
#
# T4 packages this file, byte-for-byte, as the DaemonSet's ConfigMap; it is
# not re-derived there. It receives OTLP from instrumented apps, tails every
# other container's stdout/stderr from the node's pod log directory, and
# forwards both to ingest with the workspace's bearer key.
#
# The compose form (config.compose.yaml) is a second, separate file: outside
# a cluster there is no Kubernetes API for k8sattributes to query and no
# /var/log/pods convention for filelog to read, so that file does not carry
# either — see its own header for what compose gets instead.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # The kubelet's own convention: every container's stdout/stderr, one file
  # per container, at /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
  # (T4's DaemonSet mounts that host path read-only). The `container`
  # operator parses the line shape (`format: docker` for the common
  # dockershim/containerd-with-json-log case; cri-o and plain containerd
  # bodies are auto-detected when `format` is left unset) and — because the
  # path already names the namespace, pod and container — fills
  # k8s.namespace.name/k8s.pod.name/k8s.container.name on the resource
  # before k8sattributes ever runs.
  file_log:
    include:
      - /var/log/pods/*/*/*.log
    exclude:
      # D37.3, the correctness mechanism, not a tuning knob: name every
      # container whose OTel SDK already exports logs via OTLP here, so
      # filelog never reads its file and nothing lands twice. The container
      # name is the same one the pod log path uses — no lookup needed.
      # T1 ships this empty (it has no real container names to name); T4
      # fills it in for the demo pod's instrumented container, e.g.:
      #   - /var/log/pods/*/demo-agent/*.log
      []
    include_file_path: true
    start_at: beginning
    operators:
      - type: container
        format: docker

processors:
  batch: {}

  # Enriches every span and log resource with pod identity (D37.1) beyond
  # what filelog's own path parsing already gives it: labels, owner
  # references, node name. Two association rules because OTLP-received and
  # filelog-tailed records arrive at this processor differently — an app's
  # OTLP connection carries its pod's source IP; a filelog-tailed record
  # already carries k8s.pod.name/k8s.namespace.name from the container
  # operator above.
  k8s_attributes:
    auth_type: serviceAccount
    pod_association:
      - sources:
          - from: connection
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
    extract:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.node.name

exporters:
  otlp_http:
    endpoint: "${env:OBSTACK_INGEST_ENDPOINT:-http://ingest:4318}"
    headers:
      # Phase-1 bearer key (D4), taken from the collector's own env (D39
      # rider): the same wire format apps use, so ingest treats the
      # collector as any other authenticated client. Production supplies
      # this via a values file or a mounted secret — never a committed
      # literal.
      Authorization: "Bearer ${env:OBSTACK_COLLECTOR_API_KEY}"

extensions:
  # Explicit 0.0.0.0: the default (localhost:13133) only answers loopback
  # connections, which a kubelet probe against the pod IP does not use.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [k8s_attributes, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp, file_log]
      processors: [k8s_attributes, batch]
      exporters: [otlp_http]
