name: obstack

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: obstack-clickhouse
    environment:
      # Dev defaults; override in the shell or a .env next to this file.
      OBSTACK_CLICKHOUSE_INGEST_PASSWORD: ${OBSTACK_CLICKHOUSE_INGEST_PASSWORD:-obstack_ingest_dev}
      OBSTACK_CLICKHOUSE_WEB_PASSWORD: ${OBSTACK_CLICKHOUSE_WEB_PASSWORD:-obstack_web_dev}
    # Loopback-only: the dev passwords below are in the repo, and in-compose
    # callers reach the server as `clickhouse:9000` over the compose network.
    ports:
      - "127.0.0.1:8123:8123" # HTTP — used by the web app (@clickhouse/client)
      - "127.0.0.1:9000:9000" # native — used by clickhouse-client from the host
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Mounted file-by-file: the image's entrypoint writes its own
      # default-user.xml into users.d, so the directory must stay writable.
      - ./clickhouse/users.d/obstack-users.xml:/etc/clickhouse-server/users.d/obstack-users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # The product's identity + saved-views store (D95/D112): workspaces, the
  # captured better-auth tables, and saved_views. Telemetry stays in
  # ClickHouse — these are two stores with two migration sets, and ingest is
  # the one binary that owns both sets' DDL.
  #
  # BETTER_AUTH_SECRET / BETTER_AUTH_URL are not set on THIS service — D112(b)
  # still holds, auth secrets belong to the process that signs cookies, and
  # that has never been Postgres. It IS `web` now (D251(c) — M4 adds it to
  # this file), so the secret moved there; see that service's block below.
  postgres:
    image: postgres:17.11
    container_name: obstack-postgres
    environment:
      # Dev defaults (D112); override in the shell or a .env next to this
      # file, exactly like the ClickHouse passwords above. POSTGRES_PASSWORD
      # is read by the image's entrypoint at initdb time ONLY — changing it
      # against an existing `postgres-data` volume does not rotate anything,
      # it just breaks the DSN below. Start from `down -v` to change it.
      POSTGRES_USER: obstack
      POSTGRES_PASSWORD: ${OBSTACK_POSTGRES_PASSWORD:-obstack_postgres_dev}
      POSTGRES_DB: obstack
    # Loopback-only, same posture as ClickHouse's: in-compose callers reach
    # the server as `postgres:5432`, and the web app runs on the host against
    # 127.0.0.1:5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces the TCP path on purpose. The image's entrypoint
      # runs its initdb phase against a temporary server listening on the
      # unix socket only, so a socket-based pg_isready reports ready while
      # the database is still being created — and ingest, which connects over
      # TCP, would then start against a server that is not there yet.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "obstack", "-d", "obstack"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ingest:
    build:
      context: ../../services/ingest
    container_name: obstack-ingest
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Ingest owns the obstack database and its DDL, applied at boot from the
      # migrations embedded in the binary. One container is one migration runner,
      # which is the whole guarantee — do not scale this service. See the
      # README's "Exactly one migration runner per upgrade".
      CLICKHOUSE_DSN: clickhouse://obstack_ingest:${OBSTACK_CLICKHOUSE_INGEST_PASSWORD:-obstack_ingest_dev}@clickhouse:9000/obstack
      # The second tracked migration set (services/ingest/pgmigrations/),
      # applied at boot from the same binary — OBSTACK_PG_MIGRATE_ON_BOOT is
      # unset and therefore true here, exactly like OBSTACK_MIGRATE_ON_BOOT.
      # The one-runner rule covers both stores: do not scale this service.
      #
      # This DSN is also the serving path's key authority (D98): API keys are
      # `api_keys` rows read through a cached lookup, so there is no key
      # variable here to set. The dev credential clients send below,
      # `ok_dev_local`, is the continuity row seeded by pgmigrations/0004.
      OBSTACK_POSTGRES_DSN: postgres://obstack:${OBSTACK_POSTGRES_PASSWORD:-obstack_postgres_dev}@postgres:5432/obstack
      # D287 — the Vercel log drain's OPTIONAL signature secret, passed through
      # with an empty default. Empty means the drain route authenticates on the
      # bearer key alone (its posture is logged at boot); set it to the secret
      # the drain was configured with and `x-vercel-signature` is verified.
      # Host-layer name, container-layer name — the established two-layer
      # pattern (OBSTACK_POSTGRES_PASSWORD → POSTGRES_PASSWORD).
      OBSTACK_VERCEL_DRAIN_SECRET: ${OBSTACK_VERCEL_DRAIN_SECRET:-}
    ports:
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:4318:4318" # OTLP/HTTP
      - "127.0.0.1:8080:8080" # admin — /healthz, /metrics
    healthcheck:
      # The image is distroless, so the binary probes its own /healthz.
      test: ["CMD", "/ingest", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # D278 (supersedes D263.3/.4's 30s): `Writer.Close(ctx)`'s own deadline is
    # 10s (main.go's `shutdownTimeout`), and past it the retry ladder abandons
    # remaining retries rather than sleeping past the deadline — the stated
    # worst case is <= deadline + one in-flight attempt <= 10s+30s = 40s. This
    # is the orchestrator's outer bound, with margin for the receiver and admin
    # server to also unwind — same 45s the chart's `terminationGracePeriodSeconds`
    # uses (F1), and the sdk-samples precedent for a non-default grace in this
    # file (`:274`).
    stop_grace_period: 45s
    restart: unless-stopped

  # The product surface (D251(c)): default profile, alongside clickhouse,
  # postgres and ingest — `docker compose up` now boots the whole self-hosted
  # stack. Built from T1's Dockerfile at the repo-root context (D251(a)),
  # live-stamped in place via `build:` args (D267) — this compose file only
  # ever builds and runs `live`; the `:mock` demo variant is the `images`
  # job's concern (T6), not this one.
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        OBSTACK_DATA_MODE: live
    container_name: obstack-web
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Both migration sets are ingest's DDL (see the comment on `postgres`
      # above) — the better-auth tables a login or signup reads exist only
      # once ingest itself reports healthy.
      ingest:
        condition: service_healthy
    environment:
      # The stamp baked in by the build above; also the runtime half of the
      # boot check's mismatch/absence comparison (D251(b)/D267) — this line IS
      # the "compose and the chart always set it" half of that ruling.
      OBSTACK_DATA_MODE: live
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: obstack_web
      CLICKHOUSE_PASSWORD: ${OBSTACK_CLICKHOUSE_WEB_PASSWORD:-obstack_web_dev}
      OBSTACK_POSTGRES_DSN: postgres://obstack:${OBSTACK_POSTGRES_PASSWORD:-obstack_postgres_dev}@postgres:5432/obstack
      # D265(a2): an empty default, never `:?` — that syntax fails compose
      # parse file-wide and would break every harness that never touches web
      # (smoke.sh, sdk-evidence.sh, the ddl-drift check). The refusal instead
      # lives in the boot check (mode-stamp.ts), proven against THIS
      # container's exit. D272: one in-container name, `BETTER_AUTH_SECRET` —
      # both consumers read it (better-auth's own config, `auth.ts:23`, and
      # the boot check, `mode-stamp.ts`) — the `OBSTACK_` prefix exists only
      # at this host layer, mapped from the one operator-set value,
      # `OBSTACK_BETTER_AUTH_SECRET` (.env.example).
      BETTER_AUTH_SECRET: ${OBSTACK_BETTER_AUTH_SECRET:-}
      # The origin a browser reaches this on — also the origin invite and
      # verification links are written against. Default is the loopback
      # origin this bundle actually serves over. Setting this to a real
      # https:// origin is what upgrades the session cookie to the
      # `__Secure-` name better-auth issues over TLS; left at its http://
      # default, the cookie stays downgraded (D119) — correct for a laptop
      # install, and the thing to change the moment this sits behind TLS.
      BETTER_AUTH_URL: ${OBSTACK_BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # No curl in `node:24-slim` (T1's runtime stage) — node's own fetch is
      # the probe, the sdk-sample-ts precedent (`:222`). /login is picked
      # because it renders in every mode and never depends on a session
      # already existing.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Not started by a plain `docker compose up` — it is traffic, not
  # infrastructure. Bring it up with `docker compose --profile demo up`.
  demo:
    build:
      context: ../../demo/agent-app
    container_name: obstack-demo-agent
    profiles: [demo]
    depends_on:
      ingest:
        condition: service_healthy
    environment:
      # Pure standard OTel config (D15) — the demo app reads none of it itself.
      OTEL_SERVICE_NAME: demo-agent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingest:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # The value must be URL-encoded: the SDK rejects a raw space per the OTLP
      # exporter spec, so `Bearer%20…`, not `Bearer …`.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${OBSTACK_DEMO_API_KEY:-ok_dev_local}
      # Stable HTTP semantic conventions, so the server spans carry
      # `http.request.method` — the attribute ingest classifies the api layer on.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      # A demo that takes five seconds to show anything reads as a broken
      # pipeline; both batch processors flush every second instead.
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_BLRP_SCHEDULE_DELAY: "1000"
      # Optional: seconds between self-generated requests. Unset means the app
      # only reacts to traffic you send it.
      LOOP_INTERVAL_S: ${LOOP_INTERVAL_S:-}
      # Optional: set to call the real OpenAI API instead of the built-in fake.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000" # POST /chat
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # The two SDK sample apps (S2.4 D80). Same "traffic, not infrastructure"
  # standing as `demo`, under their own profile so the sprint's evidence run —
  # `bash deploy/compose/sdk-evidence.sh`, which is also what CI's `sdk-e2e`
  # job runs — brings them up with `--profile sdk` and nothing else changes.
  #
  # Both build from the repository ROOT: each image installs its SDK out of
  # packages/, which is above the sample's own directory. The
  # `Dockerfile.dockerignore` beside each Dockerfile is what keeps that context
  # to the two directories actually needed (85/86 kB measured, not the whole
  # repo). Neither sample is an npm workspace member (D76) — demo/ stays
  # outside the product build, exactly like demo/agent-app.
  #
  # The env blocks differ between the two on purpose, and the difference is
  # measured rather than stylistic (D89/D91): obstack-py's batch processors do
  # read OTEL_BSP_*/OTEL_BLRP_*, obstack-js's do not, and the pinned JS HTTP
  # instrumentation does not consult OTEL_SEMCONV_STABILITY_OPT_IN either. A
  # variable nothing reads, set here, would advertise an effect it does not
  # have — so neither block carries one. See each sample's README.
  sdk-sample-py:
    build:
      context: ../..
      dockerfile: demo/sdk-sample-py/Dockerfile
    container_name: obstack-sdk-sample-py
    profiles: [sdk]
    depends_on:
      ingest:
        condition: service_healthy
    environment:
      OTEL_SERVICE_NAME: sdk-sample-py
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingest:4318
      # URL-encoded, like the demo's: the SDK drops a header with a raw space.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${OBSTACK_SDK_API_KEY:-ok_dev_local}
      # Both processors flush every second, so one request is queryable a
      # second later instead of five (demo precedent).
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_BLRP_SCHEDULE_DELAY: "1000"
    ports:
      - "127.0.0.1:8010:8010" # POST /chat, GET /healthz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    # 20s, not the 10s default: the fail-open evidence leg runs this same
    # service against a dead endpoint, where shutdown spends ~9s retrying the
    # export before the flush gives up (measured, T4). At 10s docker's SIGKILL
    # lands in the same second as the flush, which would make the leg's own
    # teardown a coin flip rather than the app-observable fact it is testing.
    stop_grace_period: 20s
    restart: unless-stopped

  sdk-sample-ts:
    build:
      context: ../..
      dockerfile: demo/sdk-sample-ts/Dockerfile
    container_name: obstack-sdk-sample-ts
    profiles: [sdk]
    depends_on:
      ingest:
        condition: service_healthy
    environment:
      OTEL_SERVICE_NAME: sdk-sample-ts
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingest:4318
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${OBSTACK_SDK_API_KEY:-ok_dev_local}
    ports:
      - "127.0.0.1:8100:8100" # POST /chat, GET /healthz
    healthcheck:
      # The image is node with no curl; node's own fetch is the probe.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 20s
    restart: unless-stopped

  # The same sample on the `ai` 7 line (D307). It is a copy of the service above
  # in every respect that matters to compose, because the app is a copy — the
  # one thing it proves that its sibling cannot is that `generateText` needs no
  # telemetry option on `ai` 7: the span is on by default, and a trace that
  # comes out of an app carrying no obstack option at all is the only way to
  # show it. The two Dockerfiles share the `obstack-js` pack stage byte for
  # byte, so BuildKit builds and caches that layer once for both images.
  #
  # It listens on 8100 inside the container exactly like the sibling — the two
  # never share a network namespace — and is published on a different host port
  # so both can be up at once for one evidence run.
  sdk-sample-ts-ai7:
    build:
      context: ../..
      dockerfile: demo/sdk-sample-ts-ai7/Dockerfile
    container_name: obstack-sdk-sample-ts-ai7
    profiles: [sdk]
    depends_on:
      ingest:
        condition: service_healthy
    environment:
      OTEL_SERVICE_NAME: sdk-sample-ts-ai7
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingest:4318
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${OBSTACK_SDK_API_KEY:-ok_dev_local}
    ports:
      - "127.0.0.1:8110:8100" # POST /chat, GET /healthz
    healthcheck:
      # The image is node with no curl; node's own fetch is the probe.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 20s
    restart: unless-stopped

  # Not started by a plain `docker compose up`, and not part of the default
  # `demo` path either — it is a second, opt-in ingest route (D39/Q2): apps
  # can still point straight at `ingest:4318` (M1's signed `smoke.sh` does,
  # byte-untouched), or route through here for the collector distro's
  # filelog tailing and (on Kubernetes) k8sattributes enrichment. Bring it
  # up with `deploy/collector/up.sh`, not a bare `--profile collector up` —
  # see deploy/collector/README.md for why.
  collector:
    image: otel/opentelemetry-collector-k8s:0.158.0
    container_name: obstack-collector
    profiles: [collector]
    # Docker's own container log files are root:root, mode 0640 — the same
    # requirement any log-shipping sidecar has against the host's Docker log
    # directory.
    user: "0:0"
    depends_on:
      ingest:
        condition: service_healthy
    environment:
      OBSTACK_INGEST_ENDPOINT: http://ingest:4318
      # Dev key (D39 rider); the default is the `ok_dev_local` continuity row
      # seeded by pgmigrations/0004, the same credential the demo and SDK
      # samples send. Never a committed literal in production — see
      # deploy/collector/README.md.
      OBSTACK_COLLECTOR_API_KEY: ${OBSTACK_COLLECTOR_API_KEY:-ok_dev_local}
      # Both set by `deploy/collector/up.sh` once the containers they name
      # exist; unset (matching nothing) if this service is started
      # standalone, so filelog tails nothing rather than the whole host.
      OBSTACK_COLLECTOR_TAIL_CONTAINER_ID: ${OBSTACK_COLLECTOR_TAIL_CONTAINER_ID:-}
      OBSTACK_COLLECTOR_EXCLUDE_CONTAINER_ID: ${OBSTACK_COLLECTOR_EXCLUDE_CONTAINER_ID:-}
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ../collector/config.compose.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Backs the file_storage extension's checkpoint directory (T1 review
      # escalation): a named volume survives `docker compose restart
      # collector`, unlike the container's own ephemeral layer, so a
      # restart resumes tailing instead of re-shipping every historical
      # line. Matches config.compose.yaml's OBSTACK_COLLECTOR_STORAGE_DIR
      # default — `down -v` clears it along with everything else.
      - collector-storage:/var/lib/obstack-collector
    ports:
      - "127.0.0.1:5317:4317" # OTLP/gRPC
      - "127.0.0.1:5318:4318" # OTLP/HTTP
      - "127.0.0.1:13133:13133" # health_check extension
    # No container-level healthcheck: the upstream image is a single static
    # binary with no shell (D14 — unmodified upstream), so there is nothing
    # to exec a probe with. `up.sh` polls the health_check extension above
    # from the host instead.
    restart: unless-stopped

volumes:
  clickhouse-data:
  postgres-data:
  collector-storage:
