name: obstack

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.110
    container_name: obstack-clickhouse
    environment:
      # Dev defaults; override in the shell or a .env next to this file.
      OBSTACK_CLICKHOUSE_INGEST_PASSWORD: ${OBSTACK_CLICKHOUSE_INGEST_PASSWORD:-obstack_ingest_dev}
      OBSTACK_CLICKHOUSE_WEB_PASSWORD: ${OBSTACK_CLICKHOUSE_WEB_PASSWORD:-obstack_web_dev}
    # Loopback-only: the dev passwords below are in the repo, and in-compose
    # callers reach the server as `clickhouse:9000` over the compose network.
    ports:
      - "127.0.0.1:8123:8123" # HTTP — used by the web app (@clickhouse/client)
      - "127.0.0.1:9000:9000" # native — used by clickhouse-client from the host
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Mounted file-by-file: the image's entrypoint writes its own
      # default-user.xml into users.d, so the directory must stay writable.
      - ./clickhouse/users.d/obstack-users.xml:/etc/clickhouse-server/users.d/obstack-users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ingest:
    build:
      context: ../../services/ingest
    container_name: obstack-ingest
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # Ingest owns the obstack database and its DDL, applied at boot from the
      # migrations embedded in the binary. One container is one migration runner,
      # which is the whole guarantee — do not scale this service. See the
      # README's "Exactly one migration runner per upgrade".
      CLICKHOUSE_DSN: clickhouse://obstack_ingest:${OBSTACK_CLICKHOUSE_INGEST_PASSWORD:-obstack_ingest_dev}@clickhouse:9000/obstack
      # Phase-1 keys (D4): `key:workspace_id`, comma-separated. Clients send
      # `Authorization: Bearer <key>`.
      OBSTACK_API_KEYS: ${OBSTACK_API_KEYS:-ok_dev_local:ws_demo}
    ports:
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:4318:4318" # OTLP/HTTP
      - "127.0.0.1:8080:8080" # admin — /healthz, /metrics
    healthcheck:
      # The image is distroless, so the binary probes its own /healthz.
      test: ["CMD", "/ingest", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Not started by a plain `docker compose up` — it is traffic, not
  # infrastructure. Bring it up with `docker compose --profile demo up`.
  demo:
    build:
      context: ../../demo/agent-app
    container_name: obstack-demo-agent
    profiles: [demo]
    depends_on:
      ingest:
        condition: service_healthy
    environment:
      # Pure standard OTel config (D15) — the demo app reads none of it itself.
      OTEL_SERVICE_NAME: demo-agent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingest:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # The value must be URL-encoded: the SDK rejects a raw space per the OTLP
      # exporter spec, so `Bearer%20…`, not `Bearer …`.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${OBSTACK_DEMO_API_KEY:-ok_dev_local}
      # Stable HTTP semantic conventions, so the server spans carry
      # `http.request.method` — the attribute ingest classifies the api layer on.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      # A demo that takes five seconds to show anything reads as a broken
      # pipeline; both batch processors flush every second instead.
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_BLRP_SCHEDULE_DELAY: "1000"
      # Optional: seconds between self-generated requests. Unset means the app
      # only reacts to traffic you send it.
      LOOP_INTERVAL_S: ${LOOP_INTERVAL_S:-}
      # Optional: set to call the real OpenAI API instead of the built-in fake.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000" # POST /chat
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Not started by a plain `docker compose up`, and not part of the default
  # `demo` path either — it is a second, opt-in ingest route (D39/Q2): apps
  # can still point straight at `ingest:4318` (M1's signed `smoke.sh` does,
  # byte-untouched), or route through here for the collector distro's
  # filelog tailing and (on Kubernetes) k8sattributes enrichment. Bring it
  # up with `deploy/collector/up.sh`, not a bare `--profile collector up` —
  # see deploy/collector/README.md for why.
  collector:
    image: otel/opentelemetry-collector-k8s:0.158.0
    container_name: obstack-collector
    profiles: [collector]
    # Docker's own container log files are root:root, mode 0640 — the same
    # requirement any log-shipping sidecar has against the host's Docker log
    # directory.
    user: "0:0"
    depends_on:
      ingest:
        condition: service_healthy
    environment:
      OBSTACK_INGEST_ENDPOINT: http://ingest:4318
      # Phase-1 key (D39 rider); dev default matches ingest's own default
      # key above. Never a committed literal in production — see
      # deploy/collector/README.md.
      OBSTACK_COLLECTOR_API_KEY: ${OBSTACK_COLLECTOR_API_KEY:-ok_dev_local}
      # Both set by `deploy/collector/up.sh` once the containers they name
      # exist; unset (matching nothing) if this service is started
      # standalone, so filelog tails nothing rather than the whole host.
      OBSTACK_COLLECTOR_TAIL_CONTAINER_ID: ${OBSTACK_COLLECTOR_TAIL_CONTAINER_ID:-}
      OBSTACK_COLLECTOR_EXCLUDE_CONTAINER_ID: ${OBSTACK_COLLECTOR_EXCLUDE_CONTAINER_ID:-}
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ../collector/config.compose.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Backs the file_storage extension's checkpoint directory (T1 review
      # escalation): a named volume survives `docker compose restart
      # collector`, unlike the container's own ephemeral layer, so a
      # restart resumes tailing instead of re-shipping every historical
      # line. Matches config.compose.yaml's OBSTACK_COLLECTOR_STORAGE_DIR
      # default — `down -v` clears it along with everything else.
      - collector-storage:/var/lib/obstack-collector
    ports:
      - "127.0.0.1:5317:4317" # OTLP/gRPC
      - "127.0.0.1:5318:4318" # OTLP/HTTP
      - "127.0.0.1:13133:13133" # health_check extension
    # No container-level healthcheck: the upstream image is a single static
    # binary with no shell (D14 — unmodified upstream), so there is nothing
    # to exec a probe with. `up.sh` polls the health_check extension above
    # from the host instead.
    restart: unless-stopped

volumes:
  clickhouse-data:
  collector-storage:
