# The product surface (D253 item 1, T5) — the same Deployment+Service class
# as ingest, image exact-pinned to the live-stamped artifact T1's Dockerfile
# produces (D267: `obstack-web:kind`, loaded into kind, never pulled). The
# boot check inside the image (apps/web/src/server/mode-stamp.ts) is the
# enforcement: a mismatched OBSTACK_DATA_MODE, or a live boot without
# BETTER_AUTH_SECRET, exits 1 loudly rather than serving — this chart's job
# is only to always SET the runtime half (D251(b)/D267: "compose and the
# chart always set it").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obstack
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obstack
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      # Same two gates as the ingest Deployment and for the same reason: on a
      # fresh install nothing orders this pod against the stores, and holding
      # in Init beats crash-looping into kubelet's backoff cap while the
      # migrate Jobs settle the schemas behind it. Schema STATE stays the
      # Jobs' concern — these waits gate on reachability only.
      initContainers:
        {{- include "obstack.waitForClickhouse" . | nindent 8 }}
        {{- if not .Values.postgres.managed.enabled }}
        {{- include "obstack.waitForPostgres" . | nindent 8 }}
        {{- end }}
      containers:
        - name: web
          image: {{ .Values.web.image }}
          imagePullPolicy: {{ .Values.web.pullPolicy }}
          # D253 item 5 — values.yaml states the defaults and the reasoning.
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          env:
            # The runtime half of the boot check's stamp comparison — this
            # line IS the chart's half of D267's "always set it".
            - name: OBSTACK_DATA_MODE
              value: live
            - name: CLICKHOUSE_URL
              value: http://{{ .Release.Name }}-clickhouse:8123
            - name: CLICKHOUSE_USER
              value: obstack_web
            # D275's always-secretKeyRef rule, web edition: no password sits
            # in this rendered manifest. The web read path takes the password
            # as its own variable, so no DSN assembly is needed for
            # ClickHouse.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "obstack.clickhouse.secretName" . }}
                  key: clickhouse-web-password
            # The web image has no URL-aware password injection (that code is
            # ingest's, config.InjectDSNPassword), so the DSN is assembled by
            # Kubernetes' own $(VAR) env interpolation instead: the password
            # ref is defined FIRST (interpolation only sees earlier entries),
            # and the rendered manifest still carries no password — kubelet
            # substitutes at container start, which is the D275 hygiene line.
            - name: OBSTACK_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "obstack.postgres.secretName" . }}
                  key: postgres-password
            {{- if .Values.postgres.managed.enabled }}
            # values.yaml's stricter managed-DSN contract (exactly one `@`,
            # no password component) exists for this line: the one `@` is
            # replaced with `:$(OBSTACK_PG_PASSWORD)@` so the same Secret
            # rides the operator's own DSN.
            - name: OBSTACK_POSTGRES_DSN
              value: {{ .Values.postgres.managed.dsn | replace "@" ":$(OBSTACK_PG_PASSWORD)@" | quote }}
            {{- else }}
            - name: OBSTACK_POSTGRES_DSN
              value: postgres://obstack:$(OBSTACK_PG_PASSWORD)@{{ .Release.Name }}-postgres:5432/obstack
            {{- end }}
            # D272: one in-container name, `BETTER_AUTH_SECRET` — both
            # consumers read it (auth.ts and the boot check). Empty when the
            # operator set nothing; the boot check's refusal, not a template
            # error, is what a live pod without it gets — the same posture as
            # compose (docker-compose.yml's web block).
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "obstack.web.secretName" . }}
                  key: better-auth-secret
            # D119: an `https://` origin here upgrades the session cookie to
            # its `__Secure-` name; the loopback default is correct only
            # behind `kubectl port-forward` — values.yaml carries the full
            # note.
            - name: BETTER_AUTH_URL
              value: {{ .Values.web.betterAuthUrl | quote }}
            # Optional by design (Explain's default mode is `fake`, which
            # reads no key — values.yaml): a brought web Secret may omit the
            # key entirely rather than carrying an empty one.
            - name: OBSTACK_EXPLAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obstack.web.secretName" . }}
                  key: explain-api-key
                  optional: true
            # 0.7.0 (the pilot packet's D692): the mode itself, always stated.
            # The image defaults to `fake` on its own, but a manifest that says
            # which provider a trace's explanation came from is the difference
            # between a fake panel by decision and one by omission. The
            # admitted values are the web image's own
            # (apps/web/src/server/explain/client.ts), and a value outside them
            # fails the RENDER with that module's sentence — the typo is
            # `helm template`'s to report, not a crash-looping pod's.
            {{- if not (has .Values.web.explainMode (list "fake" "anthropic")) }}
            {{- fail (printf "web.explainMode must be \"fake\" or \"anthropic\", got %q" (toString .Values.web.explainMode)) }}
            {{- end }}
            - name: OBSTACK_EXPLAIN_MODE
              value: {{ .Values.web.explainMode | quote }}
            {{- with .Values.web.explainBaseUrl }}
            # 0.8.0 (the air-gap posture): the Anthropic-compatible endpoint
            # Explain calls in `anthropic` mode — an internal gateway keeps
            # trace text inside the network (apps/web/src/server/explain/
            # anthropic.ts reads it; unset means Anthropic's own API).
            - name: OBSTACK_EXPLAIN_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.web.explainModel }}
            # The model name that endpoint serves; required by the image when
            # a base URL is set, optional otherwise (its default is Anthropic's).
            - name: OBSTACK_EXPLAIN_MODEL
              value: {{ . | quote }}
            {{- end }}
            # 0.8.0: the standalone server sends no telemetry by itself (that
            # is the Next.js CLI's, at build time); this line states the
            # posture where an operator reads it, and costs nothing.
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            {{- if .Values.web.ingress.enabled }}
            # 0.7.0 (the pilot packet's D691, S8.1 D653): the address the
            # product prints for its MCP endpoint — `/app/mcp` and the docs'
            # client setups render it through apps/web/src/server/mcp-endpoint.ts,
            # the D277 shape (an operator override read at request time, never
            # NEXT_PUBLIC_-prefixed, never baked in at build). `/mcp` is a path
            # on this same Service and the web Ingress's `pathType: Prefix` on
            # `/` already carries it, so nothing is exposed here that the
            # Service does not already serve; this line only tells the product
            # its own public name. Scheme from the Ingress's TLS flag, the
            # OTLP line's rule below. The path suffix is a second copy of
            # `MCP_PATH` (apps/web/src/lib/mcp-types.ts), pinned against this
            # template by apps/web/src/server/mcp-endpoint.test.ts.
            - name: OBSTACK_PUBLIC_MCP_ENDPOINT
              value: {{ printf "%s://%s/mcp" (ternary "https" "http" .Values.web.ingress.tls.enabled) .Values.web.ingress.host | quote }}
            {{- end }}
            {{- if .Values.ingest.ingress.enabled }}
            # D266/D277: the ingest ingress is the deployment's public OTLP
            # address, so the quickstart and connect flows render it instead
            # of the loopback defaults. HTTP only — gRPC is deliberately not
            # exposed by that ingress (values.yaml), and D277's display rule
            # makes the unset gRPC variable an honest omission in the
            # product, never a loopback beside a public endpoint.
            - name: OBSTACK_PUBLIC_OTLP_HTTP_ENDPOINT
              value: {{ printf "%s://%s" (ternary "https" "http" .Values.ingest.ingress.tls.enabled) .Values.ingest.ingress.host | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          # /login for the same reason compose's healthcheck picks it: it
          # renders in every mode and never depends on a session existing.
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
