# A normal chart resource — the DaemonSet form of T1's config
# (deploy/collector/config.yaml), one collector per node. Everything below is
# the contract deploy/collector/README.md's "What config.yaml assumes of its
# DaemonSet" section states this deployment must provide.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-collector
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obstack
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      annotations:
        # otelcol reads its config once, at process start, and the file
        # provider does not watch it — so a ConfigMap change alone leaves
        # every node's collector running the old pipeline until someone
        # restarts it by hand. Hashing the packaged config into the pod
        # template makes `helm upgrade` roll the DaemonSet exactly when
        # T1's config.yaml actually changed, and never otherwise.
        checksum/config: {{ .Files.Get "files/collector-config.yaml" | sha256sum }}
        {{- if not .Values.collector.existingSecret }}
        # 0.7.0: the key rides a secretKeyRef now (below), so a bare
        # `helm upgrade --set collector.apiKey=…` would change the Secret
        # without changing this pod template — the gap
        # templates/postgres/statefulset.yaml's checksum/secret closes, closed
        # the same way. Salted, so the annotation is not the very SHA-256 the
        # `api_keys` row stores for this token. A brought existingSecret's
        # rotation is invisible at render time: that roll is the manual
        # `kubectl rollout restart` in README.md, "Credentials and rotation".
        checksum/secret: {{ printf "collector-api-key:%s" .Values.collector.apiKey | sha256sum }}
        {{- end }}
      labels:
        app.kubernetes.io/name: obstack
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: {{ .Release.Name }}-collector
      # Root, matching docker-compose.yml's own `user: "0:0"` on the same
      # container: the node's /var/log/pods files (and the DirectoryOrCreate
      # hostPath file_storage checkpoints into, freshly created by the
      # kubelet as root:root) are no more readable/writable by the upstream
      # image's default non-root user than the Docker log directory compose
      # documents the identical requirement against.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          args: ["--config", "/etc/otelcol/config.yaml"]
          # D283: requests + limits — values.yaml states the reason.
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          env:
            - name: OBSTACK_INGEST_ENDPOINT
              value: http://{{ .Release.Name }}-ingest:4318
            # 0.7.0 (pilot packet D687, breakdown D703): a secretKeyRef into
            # the chart's own Secret (`collector-api-key`, from values.yaml's
            # collector.apiKey) or `collector.existingSecret` — never a
            # `value:` literal, which is what deploy/collector/README.md's
            # DaemonSet contract has required all along. Rotation: update the
            # Secret, then roll THIS DaemonSet and the cluster Deployment
            # (otelcol reads its env once, at process start).
            - name: OBSTACK_COLLECTOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "obstack.collector.secretName" . }}
                  key: collector-api-key
            - name: OBSTACK_COLLECTOR_EXCLUDE_CONTAINER
              value: {{ .Values.collector.excludeContainer | quote }}
            - name: OBSTACK_COLLECTOR_STORAGE_DIR
              value: {{ .Values.collector.storageDir | quote }}
            # The two facts `kubelet_stats` cannot learn for itself (D452,
            # D453), both from the Downward API because only the kubelet knows
            # them at schedule time.
            #
            # The IP, not the name, is what the scrape dials: a node's name is
            # not resolvable from inside a pod on every distro, its host IP
            # always is, and the request never leaves the node either way.
            #
            # The name is what gets STAMPED on the series: kubeletstats sets
            # k8s.node.name on node-level resources only, so without this the
            # pod and container series carry no node at all and /app/infra
            # cannot say where a pod is running.
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            # hostPort, not routed through a Service: templates/demo/deployment.yaml
            # reaches this node's own collector via the Downward API's
            # status.hostIP — node-local delivery with no cluster Service in
            # the path. It does NOT hand `from: connection` a usable source
            # IP: the same-node hairpin SNATs it away (measured — see
            # templates/demo/deployment.yaml), which is why the association
            # leads with the stamped resource attributes (D43).
            - name: otlp-grpc
              containerPort: 4317
              hostPort: 4317
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
            - name: health
              containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            # Where /var/log/pods holds symlinks into this directory instead
            # of real files (Docker-backed nodes) rather than plain files
            # (kind's containerd nodes, this config's proven runtime), the
            # tail resolves to nothing without it too. No `type:` check: on a
            # containerd-only node this path need not exist at all.
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: storage
              mountPath: {{ .Values.collector.storageDir }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-collector
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
        - name: storage
          # Writable, per-node, and outlives the collector's own pod restarts
          # (T1 review escalation) — an emptyDir does not survive a restart,
          # which is exactly the gap file_storage checkpointing closes.
          hostPath:
            path: {{ .Values.collector.storageDir }}
            type: DirectoryOrCreate
