# K1/D40: one definition of the D11 ClickHouse users. Helm's `.Files` cannot
# reach outside this chart directory, so files/obstack-users.xml is a copy of
# deploy/compose/clickhouse/users.d/obstack-users.xml, not a reference to
# it — pinned byte-for-byte by the contract test in
# services/ingest/internal/mapping/ rather than trusted to stay in sync.
#
# A normal resource, same as the StatefulSet it configures — see
# statefulset.yaml's checksum/config annotation for what makes an edit here
# actually reach a running ClickHouse.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-clickhouse-users
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  obstack-users.xml: |-
{{ .Files.Get "files/obstack-users.xml" | indent 4 }}
