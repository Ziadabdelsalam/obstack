# CI-grade ClickHouse (D35) — one replica, no PVC. A normal, release-managed
# resource (advisor ruling (c) on the T4 chart-structure escalation — see
# README.md's "Why ClickHouse is a normal resource" for the full story and
# the pre-install-hook design this replaced): `helm upgrade
# --set clickhouse.…` applies here like any other value, and `helm uninstall`
# removes it like any other resource.
#
# Because values are live now, an upgrade can legitimately REPLACE this pod
# (image bump, password change, users.xml edit) — and the schema the migrate
# Job applied has to survive that replacement, or the same upgrade's
# pre-upgrade hook has already run against data that no longer exists by the
# time ingest rolls, and ingest's verify-and-refuse pods can never go Ready.
# So the data dir is a per-node hostPath (the collector DaemonSet's own
# storage precedent), not an emptyDir: it outlives pod replacement, and dies
# with the cluster — which is exactly what "CI-grade" means here. M4, which
# wants ClickHouse to survive a node eviction too, replaces this with a
# StatefulSet and a PVC rather than inheriting the hostPath silently
# (README.md's scope boundary).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clickhouse
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two ClickHouse servers must never open the
  # same data directory, and a rolling update of a single-replica Deployment
  # surges a second pod onto the same node — with a shared hostPath, straight
  # into ClickHouse's own store locks. A brief gap on a config change is the
  # honest CI-grade trade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: obstack
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      annotations:
        # Same mechanism as templates/collector/daemonset.yaml, same reason:
        # a ConfigMap volume is looked up by name, so editing
        # files/obstack-users.xml alone does not change this Deployment's pod
        # template and therefore triggers no rollout on its own. Hashing the
        # packaged file's content in makes `helm upgrade` roll ClickHouse
        # exactly when the users config actually changed. The passwords need
        # no hash: they ride the env vars below, which ARE pod-template
        # fields, so a password change rolls this pod by itself.
        checksum/config: {{ .Files.Get "files/obstack-users.xml" | sha256sum }}
      labels:
        app.kubernetes.io/name: obstack
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          env:
            - name: OBSTACK_CLICKHOUSE_INGEST_PASSWORD
              value: {{ .Values.clickhouse.ingestPassword | quote }}
            - name: OBSTACK_CLICKHOUSE_WEB_PASSWORD
              value: {{ .Values.clickhouse.webPassword | quote }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          volumeMounts:
            # Mounted file-by-file, matching docker-compose.yml's own mount:
            # the image's entrypoint writes its own default-user.xml into
            # users.d, so the directory itself must stay writable.
            - name: users-xml
              mountPath: /etc/clickhouse-server/users.d/obstack-users.xml
              subPath: obstack-users.xml
              readOnly: true
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: users-xml
          configMap:
            name: {{ .Release.Name }}-clickhouse-users
        - name: data
          # Release-scoped so a reinstall under another name never opens a
          # predecessor's data. The kubelet creates it root:root; the image's
          # own entrypoint runs as root, chowns, and drops privileges — no
          # securityContext needed (unlike the collector, whose upstream
          # image stays non-root).
          hostPath:
            path: /var/lib/obstack-clickhouse/{{ .Release.Name }}
            type: DirectoryOrCreate
