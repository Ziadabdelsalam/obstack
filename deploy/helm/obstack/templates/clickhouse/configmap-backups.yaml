{{- if .Values.clickhouse.backups.enabled }}
# 0.7.0 (the pilot packet's D696): the `backups` disk, as a config.d file the
# StatefulSet mounts beside the image's own config — files/ carried users.d
# only until now; this is the chart's first config.d entry. Rendered only while
# `clickhouse.backups.enabled` is true; off, the ClickHouse pod template is
# byte-for-byte what 0.6.0 rendered. files/clickhouse-backups.xml carries the
# XML and the reasoning; statefulset.yaml's `checksum/backups` annotation is
# what makes an edit to it reach a running server (the users.xml mechanism).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-clickhouse-backups
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  obstack-backups.xml: |-
{{ .Files.Get "files/clickhouse-backups.xml" | indent 4 }}
{{- end }}
