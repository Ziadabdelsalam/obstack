# A pre-install hook at the same weight as the Deployment it fronts (-5):
# the migrate Job resolves this Service's DNS name from inside its own
# pre-install/pre-upgrade hook, so the Service has to exist by then too, not
# only once the chart's normal resources are created. See deployment.yaml
# for the full reasoning.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-clickhouse
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
spec:
  selector:
    app.kubernetes.io/name: obstack
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
