# PR #4's design, first real execution (deploy/compose/README.md:147-186):
# the one migration runner per upgrade is a `pre-install`/`pre-upgrade` hook
# running `/ingest migrate`, so N ingest replicas never race each other on
# DDL. `before-hook-creation` clears out the previous run's Job before this
# one is created (every upgrade re-triggers it); `hook-succeeded` also drops
# it once it passes, so a failed Job is left behind for `kubectl logs`/
# `describe` rather than silently swept.
#
# Weight 0, after ClickHouse's -5 (see templates/clickhouse/deployment.yaml)
# so ClickHouse's create request lands first — but Helm does not wait for a
# hook Deployment's rollout before moving to the next weight, so this Job
# still cannot assume ClickHouse is actually answering yet. The initContainer
# below is what makes that true, the same role compose's
# `depends_on: condition: service_healthy` plays for the ingest container.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  # Sized for a genuinely fresh cluster, which is the case the done-check
  # names: a node that has never run this chart has to pull
  # clickhouse/clickhouse-server (~250 MB) before ClickHouse can start, and
  # that pull is minutes, not seconds, on a cold cache — measured at ~5 min
  # here. A budget that only fits a warm node turns the first install on a
  # new machine (and every CI run that does not pre-load the image) into a
  # failed release. `helm --timeout` is the caller's own, shorter-if-they-say-
  # so bound on the same wait; this is only the backstop that keeps a truly
  # wedged Job from running forever.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obstack
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-clickhouse
          image: {{ .Values.utilityImage }}
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 285); do
                wget -q -O /dev/null http://{{ .Release.Name }}-clickhouse:8123/ping && exit 0
                echo "waiting for clickhouse ($i/285)..."
                sleep 2
              done
              echo "clickhouse did not become reachable in time" >&2
              exit 1
      containers:
        - name: migrate
          image: {{ .Values.ingest.image }}
          imagePullPolicy: {{ .Values.ingest.pullPolicy }}
          command: ["/ingest", "migrate"]
          env:
            # CLICKHOUSE_DSN only — deliberately not OBSTACK_API_KEYS. A
            # one-shot DDL runner has no business holding the ingest bearer
            # keys just to satisfy a validator it never consults
            # (config.LoadDSN's own doc comment; deploy/compose/README.md).
            - name: CLICKHOUSE_DSN
              value: clickhouse://obstack_ingest:{{ .Values.clickhouse.ingestPassword }}@{{ .Release.Name }}-clickhouse:9000/obstack
