# `OBSTACK_MIGRATE_ON_BOOT=false` and `OBSTACK_PG_MIGRATE_ON_BOOT=false` mean
# these pods only verify the two schemas at boot
# (services/ingest/cmd/ingest/main.go's ensureSchema/ensurePGSchema) and log
# "schema verified" for each — the migrate Job
# (templates/ingest/migrate-job.yaml) and the pg-migrate Job
# (templates/ingest/pg-migrate-job.yaml) are this revision's migration
# runners, one per store (deploy/compose/README.md's "Exactly one migration
# runner per upgrade").
#
# On a fresh `helm install`, this Deployment and both migrate Jobs are created
# in the same batch as ClickHouse and Postgres — nothing orders them — so
# these pods hold in Init:0/2, restart count zero, behind the SAME wait init
# containers the Jobs run (obstack.waitForClickhouse, _helpers.tpl;
# obstack.waitForPostgres, templates/postgres/_helpers.tpl — one define, two
# includes each). An earlier revision let them crash-loop on
# "connection refused" instead and called that the invariant working as
# designed; that was falsified as machine-specific — on a cold node the loop
# hits kubelet's 5-minute CrashLoopBackOff cap and adds up to 5 minutes of
# dead wait AFTER the migration has already succeeded, failing
# `install --wait` while the stack converged healthy. The refusal invariant
# is about SCHEMA STATE, not database reachability: install-time refusals
# may be ZERO, and the invariant's proof of record is the inverted-control
# probe (README.md), not install-time churn. The verify-and-refuse checks
# themselves are untouched in the main container — a reachable-but-unmigrated
# ClickHouse, or Postgres, is still refused loudly — so a restart here now
# means a refusal or a defect, never pull speed. Init containers gate startup
# only: a running pod that loses either database crash-loops exactly as
# before. And `helm install --wait` still blocks on the real signal — this
# Deployment cannot report Available until its pods verify both schemas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ingest
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: obstack
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obstack
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ingest
    spec:
      # D278: the shutdown ladder's stated worst case is deadline (10s) + one
      # in-flight retry attempt (≤30s) = ≤40s (Writer.Close, services/ingest/
      # internal/write/batcher.go); 45s leaves margin on top for receiver
      # drain and admin shutdown rather than sitting exactly on the app's own
      # bound. Supersedes D263.3/.4's 30s.
      terminationGracePeriodSeconds: 45
      initContainers:
        {{- include "obstack.waitForClickhouse" . | nindent 8 }}
        # Two stores, two waits, for one reason: this pod now settles BOTH
        # schemas before it binds anything, so an unreachable Postgres on a
        # fresh install would crash-loop it exactly the way an unreachable
        # ClickHouse used to — into kubelet's 5-minute backoff cap, failing
        # `install --wait` while the stack converged healthy behind it.
        # `postgres.managed.enabled` (D253 item 6) skips this: the wait
        # targets THIS chart's own Postgres Service by name, which says
        # nothing about a managed target's reachability.
        {{- if not .Values.postgres.managed.enabled }}
        {{- include "obstack.waitForPostgres" . | nindent 8 }}
        {{- end }}
      containers:
        - name: ingest
          image: {{ .Values.ingest.image }}
          imagePullPolicy: {{ .Values.ingest.pullPolicy }}
          # D253 item 5 — values.yaml states the defaults and the reasoning;
          # this line is the one place they actually apply.
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
          env:
            # D275: this Deployment always reads both passwords through
            # secretKeyRef — the chart's own Secret or an existingSecret
            # (obstack.clickhouse.secretName resolves either), never a
            # literal `value:` — so no password sits in this pod's rendered
            # DSN string either way. cmd/ingest/main.go's config.LoadDSN folds
            # OBSTACK_CLICKHOUSE_DSN_PASSWORD onto CLICKHOUSE_DSN itself
            # (config.InjectDSNPassword).
            - name: CLICKHOUSE_DSN
              value: clickhouse://obstack_ingest@{{ .Release.Name }}-clickhouse:9000/obstack
            - name: OBSTACK_CLICKHOUSE_DSN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "obstack.clickhouse.secretName" . }}
                  key: clickhouse-ingest-password
            - name: OBSTACK_MIGRATE_ON_BOOT
              value: "false"
            # The Postgres half of the same split, and required rather than
            # optional: `ingest run` refuses to boot without a DSN
            # (cmd/ingest/main.go's postgresDSN), because a serving process
            # that cannot settle the schema question has no business reporting
            # healthy. These pods only ever VERIFY it — the pg-migrate Job
            # (pg-migrate-job.yaml) is this revision's one runner — so a pod
            # that reaches a Postgres the Job has not migrated refuses loudly,
            # naming the versions, exactly as the ClickHouse half does. That is
            # also what makes `helm install --wait` gate on the Postgres
            # schema: this Deployment cannot report Available until both
            # stores check out.
            #
            # It is also the serving path's key authority (D98): API keys are
            # `api_keys` rows, read through a cached lookup, so there is no key
            # value in this chart and no env variable here to set. The
            # collector's `ok_dev_local` credential (values.yaml) authenticates
            # against the continuity row the pg-migrate Job seeds — a dev/CI
            # row a real install revokes once it has issued its own key
            # (README.md, "The first install on a real cluster, in order").
            #
            # D275: the same always-secretKeyRef rule as CLICKHOUSE_DSN above,
            # not a literal `value:` — postgresDSN (cmd/ingest/main.go) folds
            # OBSTACK_POSTGRES_DSN_PASSWORD onto OBSTACK_POSTGRES_DSN the same
            # way. POSTGRES_PASSWORD being an initdb-time value (see README.md,
            # "Postgres in this chart") is a StatefulSet concern, not this
            # DSN's — this pod always wants the CURRENT Secret content.
            #
            # `postgres.managed.enabled` (D253 item 6, values.yaml) swaps the
            # host half for the operator's own DSN; the password still rides
            # the same secretKeyRef below either way, since a managed DSN
            # never carries one.
            {{- if .Values.postgres.managed.enabled }}
            - name: OBSTACK_POSTGRES_DSN
              value: {{ .Values.postgres.managed.dsn | quote }}
            {{- else }}
            - name: OBSTACK_POSTGRES_DSN
              value: postgres://obstack@{{ .Release.Name }}-postgres:5432/obstack
            {{- end }}
            - name: OBSTACK_POSTGRES_DSN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "obstack.postgres.secretName" . }}
                  key: postgres-password
            - name: OBSTACK_PG_MIGRATE_ON_BOOT
              value: "false"
            # D287 — the Vercel drain's OPTIONAL signature secret. Rendered
            # only when the operator set one (values.yaml, `ingest`), because
            # an env var referencing a Secret key that was never written keeps
            # the pod in CreateContainerConfigError; unset simply means the
            # drain route authenticates on its bearer key alone, which ingest
            # states at boot rather than leaving to be inferred. `optional:
            # true` covers the other half of that same failure — a BROUGHT
            # `ingest.existingSecret` that carries no `vercel-drain-secret`
            # key — the same way the web workload's optional Explain key does.
            {{- if or .Values.ingest.vercelDrainSecret .Values.ingest.existingSecret }}
            - name: OBSTACK_VERCEL_DRAIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "obstack.ingest.secretName" . }}
                  key: vercel-drain-secret
                  optional: true
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: admin
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
