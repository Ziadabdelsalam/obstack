# `OBSTACK_MIGRATE_ON_BOOT=false` means these pods only verify the schema at
# boot (services/ingest/cmd/ingest/main.go's ensureSchema) and log "schema
# verified" — the migrate Job (templates/ingest/migrate-job.yaml) is the
# sprint's one migration runner (deploy/compose/README.md's "Exactly one
# migration runner per upgrade").
#
# On a fresh `helm install`, this Deployment and the migrate Job are created
# in the same batch as ClickHouse — nothing orders them. These pods can
# therefore crash-loop for a few restarts before the schema exists: that is
# the verify-and-refuse invariant working as designed (PR #4), visibly,
# rather than an install-time defect. `helm install --wait` still blocks on
# the real signal — this Deployment cannot report Available until its pods
# stop refusing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ingest
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: obstack
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obstack
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ingest
    spec:
      containers:
        - name: ingest
          image: {{ .Values.ingest.image }}
          imagePullPolicy: {{ .Values.ingest.pullPolicy }}
          env:
            - name: CLICKHOUSE_DSN
              value: clickhouse://obstack_ingest:{{ .Values.clickhouse.ingestPassword }}@{{ .Release.Name }}-clickhouse:9000/obstack
            - name: OBSTACK_API_KEYS
              value: {{ .Values.ingest.apiKeys | quote }}
            - name: OBSTACK_MIGRATE_ON_BOOT
              value: "false"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: admin
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
