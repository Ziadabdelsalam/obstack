{{/*
D253 item 3 — the chart's own Secret, with an `existingSecret` name override
on every credential. Five groups, not seven: ClickHouse's two users rotate
together (both live in files/obstack-users.xml), Postgres is its own store,
the web workload's two auth slots (T5) are a third, the ingest workload's
optional drain secret a fourth, and (0.7.0) the collector's bearer key a
fifth — an operator who already runs a secrets manager for Postgres but not
for the others brings exactly one Secret per group they own, not seven. Key
names are FIXED by the chart (not values-configurable): a brought Secret has
one thing to get right instead of two. See README.md, "Credentials and
rotation".
*/}}
{{- define "obstack.clickhouse.secretName" -}}
{{- .Values.clickhouse.existingSecret | default (printf "%s-credentials" .Release.Name) -}}
{{- end -}}

{{- define "obstack.postgres.secretName" -}}
{{- .Values.postgres.existingSecret | default (printf "%s-credentials" .Release.Name) -}}
{{- end -}}

{{/*
T5's web Deployment consumes this — kept here, not in a templates/web/
helpers file, so the chart's Secret-naming rule has one definition rather
than one per consuming workload.
*/}}
{{- define "obstack.web.secretName" -}}
{{- .Values.web.existingSecret | default (printf "%s-credentials" .Release.Name) -}}
{{- end -}}

{{/*
The ingest group: today one OPTIONAL credential, the Vercel drain's signature
secret (D287). It is its own group rather than a slot on another because it
rotates with the drain configuration in someone else's dashboard, on nobody
else's schedule.
*/}}
{{- define "obstack.ingest.secretName" -}}
{{- .Values.ingest.existingSecret | default (printf "%s-credentials" .Release.Name) -}}
{{- end -}}

{{/*
The collector group (0.7.0 — pilot packet D687, breakdown D703): the bearer
key both collector workloads send to ingest. Its own group because it is a
CLIENT credential issued in the product's settings — it rotates when an
operator revokes and reissues a key, on nobody else's schedule — and because
deploy/collector/README.md's DaemonSet contract has required "from a Secret,
never a values literal" since the collector's T1.
*/}}
{{- define "obstack.collector.secretName" -}}
{{- .Values.collector.existingSecret | default (printf "%s-credentials" .Release.Name) -}}
{{- end -}}

{{/*
Rendered only for the groups actually using it (existingSecret empty): a
group whose existingSecret IS set needs nothing here, because the workloads
that read it resolve the Secret NAME through the helpers above, not through
this object. If every group brings its own Secret, this object has nothing
left to say and is skipped entirely rather than rendered empty.
*/}}
{{- if or (not .Values.clickhouse.existingSecret) (not .Values.postgres.existingSecret) (not .Values.web.existingSecret) (not .Values.collector.existingSecret) (and .Values.ingest.vercelDrainSecret (not .Values.ingest.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- include "obstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.clickhouse.existingSecret }}
  clickhouse-ingest-password: {{ .Values.clickhouse.ingestPassword | quote }}
  clickhouse-web-password: {{ .Values.clickhouse.webPassword | quote }}
  {{- end }}
  {{- if not .Values.postgres.existingSecret }}
  postgres-password: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if not .Values.web.existingSecret }}
  better-auth-secret: {{ .Values.web.betterAuthSecret | quote }}
  explain-api-key: {{ .Values.web.explainApiKey | quote }}
  {{- end }}
  {{- if and .Values.ingest.vercelDrainSecret (not .Values.ingest.existingSecret) }}
  vercel-drain-secret: {{ .Values.ingest.vercelDrainSecret | quote }}
  {{- end }}
  {{- if not .Values.collector.existingSecret }}
  collector-api-key: {{ .Values.collector.apiKey | quote }}
  {{- end }}
{{- end }}
