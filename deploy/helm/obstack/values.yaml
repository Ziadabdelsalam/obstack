# obstack Helm chart — values. M4 extends this chart's self-hosted surface in
# place (D35 — a second chart is drift): CI-grade ClickHouse and Postgres on
# StatefulSets + PVCs, ingest, the obstack-collector DaemonSet, the demo app,
# a chart-owned Secret with an `existingSecret` name override on every
# credential (D253 items 2/3/7), and — T5, landing in the same 0.3.0 train —
# the `web` workload itself, optional Ingress for web and for ingest's
# OTLP/HTTP surface, resource requests/limits, and managed-Postgres values
# (D253 items 1/4/5/6). See README.md's scope boundary for exactly what's
# here today, and its "Managed Postgres" section for that item's stated
# ceiling.
#
# Every image below is pinned to an exact tag (D14 precedent) — bumping one
# is a deliberate edit here, never a floating tag.

# Live on upgrade like every other value (advisor ruling (c) — ClickHouse is
# a normal, release-managed resource): an image bump or a password change
# rolls the ClickHouse pod and converges, with the schema surviving on the
# StatefulSet's PVC data dir. See README.md, "Why ClickHouse is a normal
# resource, and the migrate Job renders two ways".
clickhouse:
  image: clickhouse/clickhouse-server:26.3.17.110
  # Dev/CI defaults, matching deploy/compose/docker-compose.yml's own. A real
  # deployment overrides these with --set or -f, same as compose's env
  # overrides, OR routes around them entirely with existingSecret below.
  ingestPassword: obstack_ingest_dev
  webPassword: obstack_web_dev
  # Empty (default): both passwords above populate this chart's own Secret
  # (templates/secret.yaml). Set to the name of a Secret already in the
  # cluster to source both instead — fixed key names, D123 rotation
  # procedure: README.md, "Credentials and rotation".
  existingSecret: ""
  storage:
    # Dev/CI-sized default. A real deployment sets this to what its telemetry
    # retention actually needs.
    size: 20Gi
    # Empty (default): the cluster's default StorageClass provisions the PVC
    # dynamically — the shape a fresh kind cluster (rancher.io/local-path)
    # and most real clusters both satisfy out of the box. Set only to pin a
    # specific class; an explicit empty string here means something
    # different to Kubernetes (no dynamic provisioning at all), which is why
    # this field is omitted from the rendered PVC rather than set to "".
    storageClassName: ""
  # D283: REQUESTS only, deliberately no limits — a mis-estimated request
  # degrades scheduling; a mis-estimated limit OOM-kills the store, and a
  # store limit is only honest when coordinated with ClickHouse's own memory
  # settings on measured numbers (reopen-on-measurement, owner: S5's sizing
  # pass). Requests sit at/below the observed kind-acceptance footprint
  # (~1.66Gi peak under the D37 load).
  resources:
    requests:
      cpu: 500m
      memory: 1Gi

# The identity + saved-views store (D95/D112), the same class of resource as
# ClickHouse above and for the same reasons: one replica, a StatefulSet's PVC
# data dir, normal and release-managed. Telemetry stays in ClickHouse; these
# are two stores with two migration sets, and the ingest image is the one
# binary that owns both (templates/ingest/).
#
# BETTER_AUTH_SECRET / BETTER_AUTH_URL are still not here (D112 unchanged):
# they belong to the `web` block below, the workload that actually reads
# them, not to this store.
postgres:
  image: postgres:17.11
  # Dev/CI default, matching deploy/compose/docker-compose.yml's own. Unlike
  # the ClickHouse passwords above, this one is NOT live on upgrade, and the
  # difference is the image's, not this chart's: POSTGRES_PASSWORD is read by
  # the entrypoint at initdb time only, so changing it on a release whose data
  # dir already exists rotates nothing and only breaks the migrate Job's DSN.
  # See README.md, "Postgres in this chart".
  password: obstack_postgres_dev
  # Empty (default): the chart's own Secret (templates/secret.yaml). Same
  # override shape as clickhouse.existingSecret above — README.md,
  # "Credentials and rotation".
  existingSecret: ""
  storage:
    size: 10Gi
    # See clickhouse.storage.storageClassName above — same rule, same reason.
    storageClassName: ""
  # D283: same requests-only rule and reason as clickhouse.resources above;
  # observed footprint ~48Mi in the kind acceptance run.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  # D253 item 6 — point ingest (and web, its other Postgres client) at a
  # Postgres this chart does not run, instead of the StatefulSet below.
  # Disabled (default): both workloads address this chart's own Service
  # exactly as today. The password still resolves through existingSecret
  # above (the same fixed `postgres-password` key) — a managed DSN never
  # carries one.
  #
  # D284: enabling this DISABLES the in-chart Postgres — the StatefulSet and
  # both Services stop rendering — and the pg-migrate Job retargets the
  # managed DSN, so the operator's Postgres receives the schema through the
  # same one-runner Job as always. The Job failing is the reachability gate
  # by design (`--wait` fails loudly there); no second preflight exists.
  # Real-provider specifics (TLS/sslmode, provider auth) are pre-registered
  # to S5 — README.md, "Managed Postgres".
  managed:
    enabled: false
    # A full DSN with exactly ONE `@` and no password component, e.g.
    # postgres://myuser@managed.example.com:5432/obstack?sslmode=require —
    # ingest folds the Secret's password onto this at boot
    # (config.InjectDSNPassword, D275, which parses the DSN as a URL and
    # tolerates more structure); the web workload does the same through a
    # plain string `replace` of that one `@` plus Kubernetes' own $(VAR) env
    # interpolation (templates/web/deployment.yaml), since the web image has
    # no equivalent URL-aware injection code — which is why this value's
    # contract is stricter than ingest's.
    dsn: ""

# The web workload (D253 item 1, T5): the same Deployment+Service class as
# ingest below, image exact-pinned to the live-stamped artifact T1's
# Dockerfile produces. betterAuthSecret/explainApiKey are consumed through
# templates/secret.yaml's `obstack.web.secretName` (this chart's own Secret
# by default, or web.existingSecret — README.md, "Credentials and
# rotation"); this file never carries their values as a Deployment `value:`
# literal.
web:
  # Built locally and loaded into kind, live-stamped (T1's Dockerfile,
  # `--build-arg OBSTACK_DATA_MODE=live`) — the same no-registry-in-the-path
  # posture as ingest.image below. A real deployment sets `--set
  # web.image=<registry image> --set web.pullPolicy=IfNotPresent`.
  image: obstack-web:kind
  pullPolicy: Never
  # Empty by default, same as compose's own no-default posture
  # (docker-compose.yml:38-42) — the boot check (apps/web/src/server/
  # mode-stamp.ts) is what actually refuses a live-stamped pod that boots
  # without it, loudly, with the generate instruction.
  betterAuthSecret: ""
  # The origin a browser reaches this Deployment on — the same D119 posture
  # compose's own value documents. The loopback default below is correct
  # only behind a `kubectl port-forward`, and is the first thing to change
  # once this sits behind the Ingress below (or any other real hostname): a
  # `https://` origin here is what upgrades better-auth's session cookie to
  # the `__Secure-` name it issues over TLS; left at `http://`, the cookie
  # stays downgraded.
  betterAuthUrl: "http://localhost:3000"
  # 0.7.0 (the pilot packet's D692): the mode Explain and incident RCA run
  # in. The chart now SETS `OBSTACK_EXPLAIN_MODE` on the web Deployment,
  # always — the D267 posture, state the runtime half rather than leave the
  # image's default implicit — so a manifest says which provider a trace's
  # explanation came from. `fake` (the default) reads no key and answers with
  # the fake provider, and the panel says so (D102); `anthropic` calls a model
  # with the key in the web Secret's `explain-api-key` (explainApiKey below or
  # a brought web.existingSecret), and a missing key is Explain's own
  # per-request refusal, never a boot failure. Anything else is refused at
  # render (templates/web/deployment.yaml) with the web image's own sentence,
  # so a typo fails `helm template` instead of a pod.
  explainMode: fake
  # Optional, and never a boot refusal: with `explainMode: fake` above nothing
  # reads this at all (apps/web/src/server/explain/client.ts). A deployment
  # that sets the mode to `anthropic` and leaves this empty gets Explain's own
  # per-request refusal naming the missing variables — never a fabricated
  # summary (D102).
  explainApiKey: ""
  existingSecret: ""
  # D253 item 5 — conservative defaults for a Node process serving requests,
  # not a request-driven autoscaling target (HA beyond ingest's existing
  # replicas is OUT, D253): raise these for a real workspace's traffic.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # D253 item 4 — optional Ingress in front of this Service. Disabled by
  # default (a `kubectl port-forward`, or a plain ClusterIP behind some
  # other LB, is a complete, valid deployment); this chart ships no ingress
  # controller and no cert-manager (D253 refuses both as speculative
  # components) — host and tls.secretName below assume one already exists
  # in the cluster.
  #
  # 0.7.0 (the pilot packet's D691, S8.1 D653): enabling this also sets
  # `OBSTACK_PUBLIC_MCP_ENDPOINT` on this workload — `https://<host>/mcp` when
  # tls.enabled, `http://` otherwise (templates/web/deployment.yaml) — so
  # `/app/mcp` and the docs' client setups print the deployment's real
  # address instead of the loopback default. `/mcp` is a path on this same
  # Service and the Ingress's `/` prefix rule already carries it; nothing is
  # exposed that the Service does not already serve.
  ingress:
    enabled: false
    # Empty (default): the cluster's default IngressClass. Set only to pick
    # a specific one — the same rule storageClassName above follows.
    className: ""
    host: ""
    tls:
      enabled: false
      # A Secret already in the cluster (cert-manager or otherwise) — this
      # chart never issues or renders certificate material.
      secretName: ""
    annotations: {}

ingest:
  # Built locally and loaded into kind (`kind load docker-image`) — no
  # registry in the path, the same mechanism S2.0's kind check uses for the
  # demo image. A real deployment sets `--set ingest.image=<registry
  # image> --set ingest.pullPolicy=IfNotPresent`.
  image: obstack-ingest:kind
  pullPolicy: Never
  # Proves the split this chart exists for: N replicas verifying the same
  # schema, none of them applying it (deploy/compose/README.md's "Exactly
  # one migration runner per upgrade").
  replicaCount: 2
  # No key value here: API keys are Postgres `api_keys` rows (D98), issued in
  # the product and read by ingest through a cached lookup. There is nothing
  # for this chart to configure.
  #
  # The Vercel log-drain route's OPTIONAL signature secret (D287). The drain
  # authenticates with an ordinary obstack ingest key in an `Authorization:
  # Bearer` custom header, exactly like every other export — this is the
  # separate per-drain secret Vercel signs the body with, and setting it turns
  # on `x-vercel-signature` verification. Empty (the default) leaves the bearer
  # key as that route's only credential; ingest logs which posture it booted in
  # either way, so this being unset is never a silent non-verification.
  # `existingSecret` below routes it around this file the same way every other
  # credential can be (README.md, "Credentials and rotation"); a brought Secret
  # that carries no `vercel-drain-secret` key simply leaves the route on its
  # bearer key, because the reference is optional.
  vercelDrainSecret: ""
  existingSecret: ""
  # D253 item 5 — see web.resources above for the same reasoning; sized for
  # the OTLP receive + ClickHouse/Postgres write path, not a guess.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # D253 item 4 — the OTLP/HTTP surface only (D266/D277): gRPC is NOT
  # exposed here. Most ingress controllers need dedicated HTTP/2 wiring for
  # gRPC that this chart does not ship, so a self-hosted deployment's
  # quickstart shows the honest omission D277's display rule describes
  # (only the configured protocol renders) rather than a gRPC address
  # nothing actually serves. Enabling this sets
  # OBSTACK_PUBLIC_OTLP_HTTP_ENDPOINT on the web workload automatically
  # (templates/web/deployment.yaml) — nothing else to wire by hand.
  ingress:
    enabled: false
    className: ""
    host: ""
    tls:
      enabled: false
      secretName: ""
    annotations: {}

collector:
  image: otel/opentelemetry-collector-k8s:0.158.0
  # A client credential, not a server setting: the collector sends it as
  # `Authorization: Bearer <key>`, and it is authenticated against THIS
  # chart's own Postgres `api_keys` — nothing else. The only row that exists
  # there is the dev continuity key seeded by
  # services/ingest/pgmigrations/0004, which the pg-migrate Job applies, so
  # the default is the only key that works out of the box. This chart ships
  # no key-issuing surface (the `web` block above is a login/signup surface,
  # not an API-key one — D98), so a key issued in a hosted product's settings
  # is not a row here and gets 401'd. Override only with a key row that
  # exists in this chart's Postgres.
  apiKey: ok_dev_local
  # Must name the demo pod's instrumented container below (D37.3) — the
  # collector's filelog exclusion is keyed on the container name.
  excludeContainer: demo-agent
  # T1 review escalation (file_storage checkpointing): the per-node hostPath
  # the DaemonSet mounts below at this same path, so a collector restart
  # resumes instead of re-shipping every historical line.
  storageDir: /var/lib/obstack-collector
  # D283: requests AND limits — a bounded, well-understood fixed workload,
  # and a limit on a log-tailer is genuine node protection (a runaway tailer
  # is a real class, not a guess).
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Everything this release reads from the Kubernetes API server rather than
  # from a node, in one single-replica Deployment
  # (templates/collector/cluster-deployment.yaml):
  #
  #   - cluster EVENTS (scheduling failures, image pull errors, OOMKills,
  #     probe failures — the API server's own Event objects), shipped as OTLP
  #     log records so they land in `obstack.logs` next to application logs
  #     instead of being visible only to `kubectl get events`;
  #   - cluster METRICS (node readiness and memory pressure, allocatable CPU
  #     and memory, pod phase, container restarts, and each container's
  #     requests and limits), shipped as OTLP metrics and read by `/app/infra`.
  #     Usage comes from the DaemonSet's kubelet scrape; a LIMIT exists only in
  #     the API server's object, so right-sizing needs this half.
  #
  # It is not a DaemonSet, and that is correctness rather than sizing: both
  # receivers read the whole cluster, so a per-node copy would ship every event
  # and every node fact once per node. README.md, "The cluster collector
  # (events + cluster metrics)", has the full rationale.
  #
  # ON by default: a cluster whose events are missing is the case where the
  # product has least to say about a Pod that never started, and `/app/infra`
  # without this half can show usage but never a limit. The cost is one small
  # extra pod. Set `enabled: false` and the whole feature leaves the release —
  # no Deployment, no ConfigMap, and no `events` or cluster-read rules on the
  # collector's ClusterRole (templates/collector/clusterrole.yaml gates those
  # grants on this same flag, so turning the feature off narrows the RBAC
  # rather than leaving a standing unused permission).
  cluster:
    enabled: true
    # D283: requests AND limits, same ruling as collector.resources above on
    # this workload's own numbers — API watches, one 30s cluster list and a
    # batch buffer are a smaller and flatter footprint than the node's log
    # tailer, so it reserves 10m against the tailer's 50m. The limit is the one
    # that bounds an event storm and stays where it was; the request is what
    # the scheduler must actually find free on a node, and the chart's total of
    # those is a budget the acceptance checks (README.md, "The node's
    # CPU-request budget").
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

demo:
  # 0.7.0 (the pilot packet's D688). The demo pod is a fixture: the acceptance
  # rider's four-layer trace source and, through its second container, the
  # genuine NEARBY log source (D37.2) — and it sends under the seeded dev key.
  # kind and CI render it exactly as before (`true`). On a cluster carrying
  # real traffic it is noise, a CPU request and a writer into `ws_demo`: set
  # `false` and the Deployment and its Service leave the release; nothing else
  # moves. `collector.excludeContainer` keeps naming its instrumented container
  # either way — that value is a filelog rule keyed on a container NAME, so
  # excluding one that does not exist is a no-op, not a dangling reference.
  enabled: true
  image: obstack-demo-agent:kind
  pullPolicy: Never
  # D283: requests + limits, same ground as collector.resources — a traffic
  # generator is exactly the thing to bound. This block is the INSTRUMENTED
  # container's alone (templates/demo/deployment.yaml's `demo-agent`); the
  # sidecar beside it has its own below. Observed agent footprint ~55Mi, and
  # the CPU request is a reservation for an app that idles between /chat calls
  # — 25m, not the 50m it carried while one block covered both containers.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  # The uninstrumented sidecar (D37.2 — a `sh` loop echoing one heartbeat every
  # 5s) gets its OWN block rather than sharing the agent's: a log-line emitter
  # does not need the agent's reservation, and a request is a reservation, not
  # a ceiling. The whole chart's requests are a budget a single node has to fit
  # — the acceptance's first step renders this chart and refuses to go further
  # when they stop fitting (README.md, "The node's CPU-request budget"), so a
  # number raised here is a number that has to come from somewhere. The limit
  # stays generous enough that the shell is never throttled out of a heartbeat.
  sidecarResources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# A small, pinned utility image (D14 — exact tag, never floating), used
# wherever this chart needs a shell and no OTel SDK: the demo pod's second,
# uninstrumented container (D37.2 — the genuine NEARBY log source), and the
# shared wait-for-clickhouse init container (`obstack.waitForClickhouse`,
# templates/_helpers.tpl — one define, included by both the migrate Job and
# the ingest Deployment).
utilityImage: busybox:1.37.0
