apiVersion: v2
name: obstack
description: >-
  The obstack stack on Kubernetes — CI-grade ClickHouse and Postgres, the
  ingest Deployment plus its two migrate Jobs, the obstack-collector
  DaemonSet, and the demo app. M2 scope, extended in place by S3.1's Postgres
  (D35 — a second chart is drift); M4 extends this same chart again rather
  than replacing it — see README.md's scope boundary.
type: application
# 0.2.0: S3.1 added the Postgres workload and its pg-migrate Job.
# 0.3.0: S4.1 replaces the ClickHouse/Postgres Deployment+hostPath shape with
# StatefulSets+PVCs and adds a chart-owned Secret with an existingSecret
# override on every credential (D253 items 2/3/7, D268) — no upgrade path
# from 0.2.0 or earlier (README.md, "Upgrading from 0.2.0").
# 0.4.0: S4.2 adds the ingest credential group — the Vercel drain's optional
# signature secret (D287) — as a new values block, a fourth existingSecret
# override and a sixth Secret key. Its own number rather than a second edit to
# 0.3.0's: the rendered manifests change in a way an operator can observe, and
# one bump per sprint (D268) is what keeps that legible. Upgrading within M4 is
# additive — nothing here removes or renames a 0.3.0 object.
# 0.5.0: the cluster-events collector — a single-replica Deployment plus its
# own ConfigMap, and an `events` rule on the collector's ClusterRole, all
# behind `collector.k8sEvents.enabled` (default on). Its own number for the
# usual reason: an operator can observe two new objects and a widened
# ClusterRole in the rendered manifests. Still additive — nothing here removes
# or renames a 0.4.0 object, and setting the flag false renders the same set of
# objects 0.4.0 did (the ClusterRole's explanatory comment is the only textual
# difference in that render).
# 0.6.0: Kubernetes metrics. The DaemonSet scrapes its own node's kubelet and
# the 0.5.0 singleton grows a second receiver for the cluster's declared state,
# so `/app/infra` reads nodes and pods instead of sample data. The first
# NON-additive bump in M4: `collector.k8sEvents.*` is now `collector.cluster.*`
# with no alias, and the singleton's objects are renamed
# `-collector-events` → `-collector-cluster` — see README.md, "Upgrading to
# 0.6.0". The ClusterRole widens (behind the same gate) to what the
# k8sclusterreceiver's informers need at the pinned v0.158.0.
# 0.7.0: the client-pilot bump (the pilot packet's §12) — the first release
# meant for a cluster that is not a throwaway kind. Five additive items, all
# default-off or default-as-before: `demo.enabled` (D688), `web.explainMode`
# rendered as OBSTACK_EXPLAIN_MODE (D692), OBSTACK_PUBLIC_MCP_ENDPOINT from
# the web Ingress (D691/D653), the collector's key through the chart's Secret
# with `collector.existingSecret` (D687), and an opt-in ClickHouse `backups`
# disk (D696). Its own number for the usual reason: an operator can observe
# the web pod's new env line and both collector pod templates' secretKeyRef
# in the rendered manifests, and those three roll once on the upgrade — see
# README.md, "Upgrading to 0.7.0". Nothing removes or renames a 0.6.0 object;
# the demo pod, the stores and the ClusterRole render exactly as before.
# 0.8.0: the air-gap posture (deploy/airgap/README.md) — what a cluster with
# no route to the internet needs from the chart. One default-render change:
# ClickHouse's crash reporting, ON in its stock config.xml at the pinned
# version, is switched OFF by a config.d file every install mounts
# (files/clickhouse-privacy.xml), so the ClickHouse pod rolls once on this
# upgrade; the web pod rolls once for an explicit NEXT_TELEMETRY_DISABLED.
# Two default-off values: `ingest.notifier.allowPrivate` (D492's hatch, for
# receivers that are all inside the network) and `web.explainBaseUrl` /
# `web.explainModel` (an internal Anthropic-compatible gateway). Additive;
# nothing removes or renames a 0.7.0 object — README.md, "Upgrading to 0.8.0".
version: 0.8.0
appVersion: "0.1.0"
